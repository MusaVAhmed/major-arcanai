<title>ArcanAI — reader bench (WP4)</title>
<!--
  Not shipped. Serve the repo root and open /cards/reader_bench.html.

  The WP4 model bake-off. Loads one candidate at a time, runs a fixed set of
  card/seat/question cases through the reader prompt, and reports download
  size, load time, first-token latency, tokens per second, and every line it
  produced so the voice can be judged by a human. Nothing here decides
  anything: the handoff requires reporting to the Commander before a model is
  locked, and criterion 1 (never contradicts the card's meaning) and criterion
  5 (voice) are both hand-judged. This page's job is to make that judging cheap
  and repeatable.

  WHY THE CASES LOOK LIKE THIS. They are chosen for contradiction RISK, not for
  being easy: reversed faces (whose copy is second-person and punchy and so the
  easiest to over-write), cards whose meaning is a flat refusal that a model
  loves to soften, a comfort card dealt into The Obstacle so the seat pulls
  against the card, the same card in two seats to prove the seat actually moves
  the line, and a question from a different domain than the card. A model that
  passes on easy cases tells you nothing.

  DETERMINISM. Cases are read live from the built page's DECK and from
  seats.js, so they cannot drift from what ships. Generation is greedy
  (do_sample false) so two runs of the same build and model are comparable.

  THE ARMS. Four things vary, and only one of them at a time should:
    - model / dtype / device — the bake-off proper.
    - prompt A / A20 / B. A and B differed in TWO ways (leash AND word cap), so
      the finding that honesty costs voice was confounded. A20 is A at B's cap.
      A vs A20 isolates the cap; A20 vs B isolates the leash.
    - seat prose vs lens. The handoff specifies prose, but prose is matching
      text written flat for a cosine and never shown to anyone; lens is the
      display text and carries the register. Prose may be flattening the output.
  D1 PRE-SCREEN embeds each produced line and cosines it against the meaning and
  against the question. It sorts suspicion to the top of the table; it does not
  judge. Criterion 1 and criterion 5 remain hand-judged, by design.

  RUNNING IT ON A PHONE, which is the point — Tier 2 is the tier that reaches
  phones, and desktop numbers do not transfer. Per CLAUDE.md:
      cloudflared tunnel --url http://localhost:8642 --protocol http2
  then open /cards/reader_bench.html on the handset. Expect a large download
  per model; they are cached by the browser afterwards.
-->

<h1>Reader bench &middot; WP4 bake-off</h1>

<script type="module">
/* This USED to be pinned to attune.js's 3.3.3 so the library was fetched once
   and shared with the page's MiniLM. It is deliberately ahead of it now, and
   the reason is a hard blocker rather than a preference:

   3.3.3 bundles onnxruntime-web 1.20.1. Chrome ships a native Float16Array now,
   ORT maps the float16 data type onto it, and 1.20.1's tensor check rejects the
   Uint16Array that transformers.js actually hands it —
       "a float16 tensor's data must be type of function Float16Array()"
   — so EVERY q4f16 and fp16 run dies at load. q4 is untouched, which is why
   this went unnoticed through a full q4 bake-off run. ORT 1.21.0 accepts
   Uint16Array again (microsoft/onnxruntime#23827); 3.5.0 is the first
   transformers.js carrying it, and 3.7.6 is the last of the 3.x line. v4 is
   available but is a major bump and this file is not the place to discover
   what changed in it.

   Two consequences, both deliberate:
   - The bench now pays for a second copy of the library. It is a dev tool that
     is never shipped, so this costs nothing that matters.
   - attune.js is NOT bumped along with it. It runs MiniLM at q8, which has no
     float16 tensors and is therefore unaffected — and every measured number in
     CLAUDE.md (reversal rate, lean stops, the resonance background) was taken
     on 3.3.3. Bumping the shipped page is a re-measuring job, not an edit.
     speak.js will force that decision if it wants q4f16; it is not this file's
     to make. */
const LIBS = {
  '3.7.6': 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js',
  '4.2.0': 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0/dist/transformers.min.js',
};
/* The library version is an ARM, because on mobile WebGPU it decides whether
   there is a usable configuration at all. 3.x is squeezed from both sides:
   q4f16 has the fp16 overflow (sanity 0/3, output all "!") and q4 needs about
   twice the device memory for the same model, which takes the tab. v4 rewrote
   the WebGPU runtime in C++ and is the plausible way out — if it fixes q4f16
   then the fp16 footprint comes back with correct numerics and the squeeze
   dissolves. Verified API-compatible with everything this bench uses:
   TextStreamer, token_callback_function, skip_prompt (same put() ordering, so
   TTFT stays honest), apply_chat_template's kwarg spread (so enable_thinking
   still reaches Qwen3), progress_callback, return_full_text and dispose.

   The D1 screener stays pinned to 3.7.6 regardless. Its cosines are compared
   across runs, and a screener that changed version mid-bake-off would move the
   numbers under the comparison for no benefit. */
const SCREEN_CDN = LIBS['3.7.6'];

/* ---- inference runs in a Worker ----
   Not a nicety. A 135M model on the wasm backend blocks the main thread hard
   enough that the tab stops answering at all — which is the same reason the
   handoff requires speak.js to use a Worker so generation cannot stutter the
   card flip, the deal, or the gyro foil. Doing it here too means the bench
   measures the arrangement that will actually ship, and means a phone running
   this page stays usable while it downloads half a gigabyte.

   Inlined as a Blob so this file stays a single self-contained page with no
   build step, matching the rest of the project. */
const WORKER_SRC = (CDN) => `
import { pipeline, env, TextStreamer } from '${CDN}';
env.allowLocalModels = false;
let gen = null;
let tmpl = 'messages';   // 'string' once the tokenizer proves it can template

/* Qwen3 is a hybrid reasoning model: left alone it emits a <think> block before
   the answer, which blows the word cap and reads as garbage in the table. The
   switch is 'enable_thinking', and it lives in the CHAT TEMPLATE, not in the
   generation options — so there is nowhere to pass it when messages go straight
   into the pipeline. We template by hand instead, and pass the flag there.
   Harmless for every other candidate: a template that does not use the variable
   ignores it. Falls back to raw messages if the tokenizer has no template. */
function toPrompt(system, user) {
  if (tmpl !== 'string') return [{ role: 'system', content: system },
                                 { role: 'user', content: user }];
  return gen.tokenizer.apply_chat_template(
    [{ role: 'system', content: system }, { role: 'user', content: user }],
    { tokenize: false, add_generation_prompt: true, enable_thinking: false });
}

/* Belt and braces: a model can still think even with the flag set, and a
   truncated think block never closes. Report it rather than silently scoring
   the reasoning as the line. */
function stripThink(s) {
  if (!/<think>/i.test(s)) return { txt: s.trim(), think: false };
  const i = s.search(/<\\/think>/i);
  return { txt: (i === -1 ? s : s.slice(i + 8)).trim(), think: true };
}

self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.cmd === 'free') {
      /* terminate() alone is not enough. ORT holds GPU buffers for the session,
         and killing the thread does not reliably hand them back promptly --
         across a session of load/kill cycles on a phone that accumulates until
         the tab dies. dispose() is the documented teardown; call it and wait
         for it before the worker goes away. */
      try { await gen?.dispose?.(); } catch (_) {}
      gen = null;
      self.postMessage({ type: 'freed' });
      return;
    }
    if (m.cmd === 'load') {
      try { await gen?.dispose?.(); } catch (_) {}   // never hold two sessions
      gen = null;
      /* Byte accounting: sum the HIGH-WATER 'loaded' per file. The 'done'
         events do not reliably carry a total, and summing raw progress events
         double-counts, which is how this first read 0.0 MB. Download size is
         selection criterion 3, so it has to be right. */
      const seen = new Map();
      const total = () => { let s = 0; seen.forEach((v) => { s += v; }); return s; };
      const t0 = performance.now();
      /* Progress is THROTTLED, and it has to be. Measured on this bench: a
         260 MB model fires 6014 progress callbacks in 32 s — about 190 a
         second — and a 1.3 GB candidate fires roughly five times that.
         Forwarding every one is a postMessage plus a DOM write on the main
         thread, and the moment the main thread cannot drain the queue as fast
         as the worker fills it the backlog compounds: the download appears to
         slow down and then freeze partway, which is precisely the symptom this
         caused on a phone. The byte accounting still sees EVERY event -- only
         the reporting is throttled -- and any change of status still posts
         immediately, so 'done'/'ready' are never swallowed. */
      let lastPost = 0, lastStatus = null;
      gen = await pipeline('text-generation', m.model, {
        dtype: m.dtype, device: m.device,
        progress_callback: (p) => {
          if (p.file && (p.loaded || p.total)) {
            seen.set(p.file, Math.max(seen.get(p.file) || 0, p.loaded || 0, p.total || 0));
          }
          const now = performance.now();
          if (p.status === lastStatus && now - lastPost < 100) return;
          lastPost = now; lastStatus = p.status ?? null;
          self.postMessage({ type: 'progress', status: p.status, file: p.file,
                             pct: p.progress, bytes: total() });
        },
      });
      const loadMs = Math.round(performance.now() - t0);
      try {
        const probe = gen.tokenizer.apply_chat_template(
          [{ role: 'user', content: 'x' }],
          { tokenize: false, add_generation_prompt: true, enable_thinking: false });
        if (typeof probe === 'string' && probe.length) tmpl = 'string';
      } catch (_) {}
      self.postMessage({ type: 'loaded', loadMs, bytes: total(), tmpl });
    } else if (m.cmd === 'gen') {
      /* A real TextStreamer with skip_prompt, not a hand-rolled put(). Two
         things depend on it and both were wrong before: the first callback now
         fires on the first GENERATED token rather than during prompt
         processing, so ttft is criterion 4 for real; and the token callback
         counts tokens exactly, so tok/s is no longer characters/4 — an estimate
         that silently compared one tokenizer's characters-per-token against
         another's and called the ratio throughput. */
      let first = null, nTok = 0;
      const streamer = new TextStreamer(gen.tokenizer, {
        skip_prompt: true,
        skip_special_tokens: true,
        callback_function: () => {},
        token_callback_function: (t) => {
          if (first === null) first = performance.now();
          nTok += (t && t.length) || 1;
        },
      });
      const input = toPrompt(m.system, m.user);
      const opts = { max_new_tokens: m.maxTok, do_sample: false, streamer };
      if (typeof input === 'string') opts.return_full_text = false;
      const s = performance.now();
      const r = await gen(input, opts);
      const done = performance.now();
      const g = r && r[0] && r[0].generated_text;
      let raw = typeof g === 'string' ? g
              : (Array.isArray(g) && g.at(-1) ? g.at(-1).content : '') || '';
      const { txt, think } = stripThink(raw);
      /* If token_callback_function is absent in this build, nTok stays 0 and we
         say so rather than quietly reporting an estimate as a measurement. */
      const counted = nTok > 0;
      const toks = counted ? nTok : Math.max(1, Math.round(txt.length / 4));
      /* tok/s is generation throughput, so it is measured from the FIRST token
         to the last -- not from the call. Dividing by (done - s) folds prompt
         processing into the rate, which penalises short outputs hardest
         because the fixed prompt cost is amortised over fewer tokens. Measured
         on SmolLM2-360M: prompt B looked like 11.1 tok/s against prompt A's
         20.7 purely because B's lines are shorter. That is not a speed
         difference, and it would have been read as one when comparing models.
         Falls back to the old denominator if the streamer never fired. */
      const genMs = first ? done - first : done - s;
      self.postMessage({ type: 'gen', id: m.id, txt,
        think,
        truncated: counted && nTok >= m.maxTok,
        counted,
        tokens: toks,
        ttft: first ? Math.round(first - s) : null,
        totalMs: Math.round(done - s),
        genMs: Math.round(genMs),
        tps: +(toks / Math.max(1, genMs) * 1000).toFixed(1) });
    }
  } catch (err) {
    self.postMessage({ type: 'error', message: String(err && err.message || err) });
  }
};
`;

function spawnWorker(onProgress, cdn) {
  const url = URL.createObjectURL(new Blob([WORKER_SRC(cdn)], { type: 'text/javascript' }));
  const w = new Worker(url, { type: 'module' });
  URL.revokeObjectURL(url);
  const waiters = new Map();
  let fatal = null;
  w.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'progress') { onProgress(m); return; }
    if (m.type === 'error') {
      fatal = new Error(m.message);
      waiters.forEach(({ reject }) => reject(fatal));
      waiters.clear();
      return;
    }
    const key = m.type === 'loaded' ? 'load'
              : m.type === 'freed' ? 'freed'
              : 'gen:' + m.id;
    const p = waiters.get(key);
    if (p) { waiters.delete(key); p.resolve(m); }
  };
  w.onerror = (e) => {
    fatal = new Error('worker failed: ' + (e.message || 'unknown'));
    waiters.forEach(({ reject }) => reject(fatal));
    waiters.clear();
  };
  const send = (key, msg) => new Promise((resolve, reject) => {
    if (fatal) return reject(fatal);
    waiters.set(key, { resolve, reject });
    w.postMessage(msg);
  });
  return {
    load: (model, dtype, device) => send('load', { cmd: 'load', model, dtype, device }),
    gen: (() => { let n = 0; return (system, user, maxTok) => {
      const id = ++n; return send('gen:' + id, { cmd: 'gen', id, system, user, maxTok }); }; })(),
    free: () => send('freed', { cmd: 'free' }),
    kill: () => w.terminate(),
  };
}

/* The candidate list. The first four are the handoff's; the rest were added on
   2026-08-03 when the Commander lifted criterion 3's "under 300MB strongly
   preferred". That cap is GONE — it was eliminating everything except SmolLM2,
   and the small models are precisely the ones that cannot hold the deck's
   voice (SmolLM2-135M q4 does not rewrite at all; it echoes the prompt back
   and loops).

   Size is still REPORTED, and must be: D5 is a consent rule, not a size cap —
   "show the download size before the first byte" — and it survives untouched.

   What actually bounds this now is the handset, not policy. A 1GB+ model has
   to fit in the phone's RAM and inside WebGPU's maxStorageBufferBindingSize;
   past roughly a gigabyte, expect OOM or an adapter refusal on mobile rather
   than a slow-but-working run.

   Sizes below are the q4f16 export. q4f16 is NO LONGER the one to try first in
   every case: it is 4-bit weights with fp16 COMPUTE, and ONNX Runtime Web
   overflows fp16 on the WebGPU backend for some architectures, emitting a
   stream of one repeated token — token id 0, which prints as "!" in Qwen's
   tokenizer (microsoft/onnxruntime#26732). Measured here on 2026-08-05:
   Qwen2.5-0.5B q4f16 scored sanity 0/3 with nothing but "!" on an adreno-7xx,
   and the SAME model, dtype and export scored 3/3 on the wasm backend — so it
   is the backend's numerics, not the model or the conversion. gemma-3 is named
   in that issue too, so expect the same. Use q4 (4-bit weights, fp32 compute)
   on WebGPU for anything that fails the gate, and take the larger download.
   This is exactly what the sanity gate exists to catch: the output was fluent
   nonsense of a kind no card-line reading would have flagged. */
const MODELS = [
  'HuggingFaceTB/SmolLM2-360M-Instruct',        // q4f16 260 MB
  'HuggingFaceTB/SmolLM2-135M-Instruct',        // q4f16 112 MB — measured unusable, kept as the floor
  'onnx-community/Qwen2.5-0.5B-Instruct',       // q4f16 461 MB
  'onnx-community/Qwen3-0.6B-ONNX',             // q4f16 543 MB
  'onnx-community/gemma-3-1b-it-ONNX',          // q4f16 728 MB
  'onnx-community/Llama-3.2-1B-Instruct',       // q4f16 1039 MB (external .onnx_data)
  'HuggingFaceTB/SmolLM2-1.7B-Instruct',        // q4f16 1057 MB
  'onnx-community/Qwen2.5-1.5B-Instruct',       // q4f16 1165 MB
  'onnx-community/Qwen3-1.7B-ONNX',             // q4f16 1360 MB
];

/* Prompt A is the handoff's text, verbatim, so the bench measures the design as
   specified. Prompt B is the revision that came out of the Gemini Nano
   validation on 2026-08-03: A's failures all clustered on the model answering
   the QUESTION instead of re-voicing the CARD, and B forbids exactly that.
   B fixed every D1 failure and cost most of the voice, which is the tradeoff
   the bake-off now has to weigh per model. Keep both; the interesting result is
   which model needs the least of B's leash to stay honest. */
/* A20 exists because A and B differed in TWO things, not one: B forbids
   answering the question AND caps at 20 words where A caps at 25. The
   conclusion drawn from that comparison — that honesty costs voice — was
   therefore confounded with losing a fifth of the line. A20 is A verbatim
   except for the number, so:
       A vs A20   isolates the cap
       A20 vs B   isolates the leash, at equal length
   Criterion 5 now turns on which of those did the flattening. */
const aText = (n) =>
  "You rewrite a single line of a sarcastic oracle deck. You never invent " +
  "meanings. You are given the card's meaning and you rewrite it to speak to " +
  "one specific position in the spread and one specific question. Under " + n + " " +
  "words. No preamble. No quotes. Dry, blunt, funny. Second person.";
const SYS = {
  A: aText(25),
  A20: aText(20),
  B: "You rewrite one line of a sarcastic oracle deck.\n" +
     "You are given a card's MEANING. You rewrite that meaning so it speaks to one position in a spread.\n" +
     "The question is context for tone only. NEVER answer it. Never predict what will happen. " +
     "Never assert anything about the seeker or anyone else. Never give advice the meaning does not already give.\n" +
     "Every claim you make must already be present in the meaning. Keep the meaning's stance: if the " +
     "meaning says something is good, it stays good; if it turns from bad to good, keep the turn.\n" +
     "Under 20 words. No preamble. No quotation marks. No markdown. No ellipses. Dry, blunt, funny. Second person.",
};
const CAP = { A: 25, A20: 20, B: 20 };

/* [card name, reversed, spread mode, seat index, question] — see the header
   comment for why each one is here. */
const CASES = [
  ['The Dead End Job',     0, 3, 2, 'should I quit my job'],
  ['The Dead End Job',     0, 5, 1, 'should I quit my job'],
  ['The Cheese Fries',     0, 5, 1, 'should I quit my job'],
  ['The Cheese Fries',     0, 3, 1, 'am I looking after myself'],
  ['The Last Flying Fuck', 1, 5, 2, 'how do I say no to my sister without a row'],
  ['The Lovers',           1, 5, 4, 'is he cheating on me'],
  ['The Moon',             0, 5, 1, 'does he still think about me'],
  ['The Apology',          1, 3, 2, 'should I text him back'],
  ['The Tower',            0, 5, 4, 'should I move to another city'],
  ['The Nap',              0, 5, 2, 'why do I feel stuck all the time'],
  ['The Waiting Room',     1, 3, 0, 'will the grief ever ease off'],
  ['The Audacity',         0, 5, 3, 'am I the problem'],
];

/* The numeric sanity check the handoff insists on. There are ONNX Runtime Web
   overflow bugs that produce fluent-looking garbage at fp16 and q4f16 on
   WebGPU, so "it loaded and emitted English" is not a pass. None of these is
   about the deck; they are about whether the numerics survived quantisation.
   A model failing any of them must not be judged on its card lines at all. */
const SANITY = [
  { id: 'echo',   prompt: 'Repeat exactly this and nothing else: the quick brown fox',
    test: t => /quick brown fox/i.test(t), why: 'cannot follow a trivial instruction' },
  { id: 'arith',  prompt: 'What is 2 + 2? Answer with the number only.',
    test: t => /\b4\b|four/i.test(t), why: 'arithmetic broken — classic overflow symptom' },
  /* Deliberately tolerant of formatting. SmolLM2-135M answers this as
     "1. 2 / 2. 3 / 3. 4" — a mangled numbered list, not corrupted numerics,
     and an intolerant regex disqualified a model whose arithmetic was fine.
     The gate is for overflow garbage, so it asks only that 1, 2 and 3 appear
     in order somewhere in the digit stream. */
  { id: 'count',  prompt: 'List the first three positive integers, comma separated.',
    test: t => /1[\s\S]*2[\s\S]*3/.test(t.replace(/[^0-9]/g, '')) ||
               /one[\s\S]*two[\s\S]*three/i.test(t), why: 'sequence broken' },
];

/* GARBAGE IS NOT THE SAME AS WRONG, and the gate must not conflate them.
   Corrupted numerics produce a stream of one repeated token — Qwen2.5-0.5B at
   q4f16 on WebGPU answered all three checks with "!!!!!!!!" — and that is the
   thing the gate exists to catch. A model that answers "2" to 2 + 2 in fluent
   English has intact numerics and weak arithmetic, which is a different fact
   and must not disqualify it: Qwen3-0.6B does exactly this with thinking
   disabled, and disabling thinking is OUR doing (it is how the <think> blocks
   are kept out of the word cap). Failing it on that would reject a candidate
   for a limitation the bench itself imposed. */
const isGarbage = (t) => {
  const s = (t || '').trim();
  if (!s) return true;
  const compact = s.replace(/\s+/g, '');
  if (/^(.)\1{5,}$/.test(compact)) return true;              // "!!!!!!!!"
  const toks = s.split(/\s+/);
  if (toks.length >= 6 && new Set(toks).size <= 2) return true;   // one token looped
  const nonLatin = (s.match(/[^\x00-\x7F]/g) || []).length;
  return s.length > 8 && nonLatin / s.length > 0.3;
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
const fmtMB = b => (b / 1048576).toFixed(1) + ' MB';

const modelSel = $('model');
MODELS.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; modelSel.appendChild(o); });

/* ---- environment, reported up front because it is half the result ---- */
(async () => {
  const bits = [];
  bits.push('UA: ' + navigator.userAgent);
  bits.push('cores: ' + (navigator.hardwareConcurrency ?? '?') +
            ' · deviceMemory: ' + (navigator.deviceMemory ?? '?'));
  if (!('gpu' in navigator)) bits.push('<span class="bad">navigator.gpu ABSENT — no WebGPU. Any webgpu run will fail or silently fall back; do not report its numbers.</span>');
  else {
    try {
      const a = await navigator.gpu.requestAdapter();
      if (!a) bits.push('<span class="bad">navigator.gpu present but requestAdapter() returned NULL — no adapter. Perf numbers from this machine are meaningless.</span>');
      else {
        bits.push('<span class="ok">adapter: ' + esc([a.info?.vendor, a.info?.architecture, a.info?.description].filter(Boolean).join(' / ') || 'unnamed') +
                     '</span> · shader-f16: ' + (a.features?.has('shader-f16') ? 'yes' : '<span class="warn">NO — q4f16 will be slow or unavailable</span>'));
        /* The ceiling, reported BEFORE anything is downloaded. ORT dequantizes
           4-bit weights up to the compute precision on device, so a q4 (fp32
           compute) run needs roughly twice the device memory of the same model
           at q4f16 -- on top of a larger download. When a model downloads and
           then takes the tab with it, this is the number that predicted it, and
           there is no reason to learn it the expensive way. */
        const L = a.limits || {};
        const mb = (v) => v ? (v / 1048576).toFixed(0) + ' MB' : '?';
        bits.push('limits: maxStorageBufferBindingSize ' + mb(L.maxStorageBufferBindingSize) +
                  ' · maxBufferSize ' + mb(L.maxBufferSize) +
                  '<br><span class="dim">A model whose largest weight tensor exceeds the binding size will not run. ' +
                  'q4 needs ~2x the device memory of q4f16 for the same model: if q4f16 loads and q4 kills the tab, ' +
                  'it fits at fp16 and does not fit at fp32 — that is a result, not a bug.</span>');
      }
    } catch (e) { bits.push('<span class="bad">adapter error: ' + esc(e.message) + '</span>'); }
  }
  bits.push('Chrome Prompt API (Tier 1): ' + ('LanguageModel' in self
    ? '<span class="ok">present</span> — availability: ' + esc(await LanguageModel.availability().catch(e => 'ERR ' + e.message))
    : 'absent'));
  $('env').innerHTML = bits.join('<br>');
})();

/* ---- cases are read from the built page so they cannot drift ---- */
/* seatField picks which of the seat's two texts the model is shown. `prose` is
   what the handoff specified, but per CLAUDE.md prose is MATCHING text: written
   long and plain so a cosine can find it, and never displayed to anyone. `lens`
   is the display text and carries the deck's register. Feeding a model prose
   optimised to embed is a plausible contributor to output that reads flat, so
   it is an arm here rather than an assumption. */
function buildCases(seatField) {
  const w = $('f').contentWindow;
  let DECK, SEATS;
  try { DECK = w.eval('DECK'); SEATS = w.ARCANAI_SEATS; }
  catch (e) { throw new Error('could not read DECK from the draw page — is release/major-arcanai/index.html built? ' + e.message); }
  if (!SEATS) throw new Error('seats.js did not load in the draw page');
  const byName = {}; DECK.forEach(c => { byName[c.name] = c; });
  return CASES.map(([name, rev, mode, si, q]) => {
    const c = byName[name];
    if (!c) throw new Error('unknown card in CASES: ' + name);
    const seat = SEATS.seats[mode][si];
    // lens ends in a colon by design (it prefixes the meaning on the page);
    // that punctuation is meaningless mid-prompt, so drop it.
    const seatTxt = String(seat[seatField] || seat.prose || '').replace(/:\s*$/, '');
    return {
      name, rev: !!rev, seat: seat.label || seat.name, q,
      meaning: rev ? c.r : c.meaning,
      user: `Card: ${c.name}${rev ? ', reversed' : ''}\n` +
            `Its meaning: ${rev ? c.r : c.meaning}\n` +
            `In practice: ${rev ? c.sitr : c.sit}\n` +
            `Position: ${seat.label || seat.name}, ${seatTxt}\n` +
            `They asked: ${q}\n` +
            `Rewrite the meaning for this position.`,
    };
  });
}

/* ---- automatic flags. These do NOT judge the reading; they catch the
   mechanical failures a post-filter would have to catch in speak.js, so the
   human only has to judge contradiction and voice. ---- */
const PREAMBLE = /^(here('s| is)\b|sure\b|okay\b|ok\b|certainly\b|of course\b|rewritten\b|rewrite:|response:|output:|answer:)/i;
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
function flags(text, kase, cap) {
  const f = [];
  const words = text ? text.trim().split(/\s+/).length : 0;
  if (!text.trim()) f.push('EMPTY');
  if (words > cap) f.push('OVER' + cap);
  if (PREAMBLE.test(text.trim())) f.push('PREAMBLE');
  if (/^["'“]/.test(text.trim())) f.push('WRAPPED-QUOTES');
  if (/["“”]/.test(text)) f.push('quotes');
  if (/[*_]{1,2}\w/.test(text)) f.push('MARKDOWN');
  if (/\.\.\.|…/.test(text)) f.push('ellipsis');
  if (/\n/.test(text.trim())) f.push('MULTILINE');
  if (new RegExp('^' + kase.seat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:', 'i').test(text.trim())) f.push('SEAT-LABEL-LEAK');
  const a = norm(text), b = norm(kase.meaning);
  if (a && b && (a === b || (b.length > 12 && a.includes(b)) || (a.length > 12 && b.includes(a)))) f.push('NEAR-COPY');
  // a 4-gram repeated three times is a degenerate loop, not a sentence
  const t = a.split(' ');
  for (let i = 0; i + 4 <= t.length; i++) {
    const g = t.slice(i, i + 4).join(' ');
    if (g.length > 8 && a.split(g).length - 1 >= 3) { f.push('REPETITION-LOOP'); break; }
  }
  // an English prompt should not come back mostly non-Latin
  const nonLatin = (text.match(/[^\x00-\x7F]/g) || []).length;
  if (text.length > 10 && nonLatin / text.length > 0.1) f.push('CHARSET-GARBAGE');
  return { words, flags: f };
}

/* ---- D1 pre-screen ---------------------------------------------------------
   The flags above catch mechanical junk. They cannot catch the failure that
   actually matters — the model answering the QUESTION instead of re-voicing the
   CARD, which is what "you're drifting, not cheating" was. That is hand-judged,
   and hand-judging 12 cases x 9 models x 3 prompts x 2 dtypes is how careful
   reading turns into skimming.

   So: embed the produced line and cosine it against the card's meaning and
   against the question. A line that sits closer to the question than to the
   meaning has drifted toward answering it. This is NOT a verdict — it is a
   sort order, so the suspicious lines get read first and the obvious passes
   last. Same model and dtype the page itself uses, so the screener is a tool
   this repo already trusts rather than a new dependency. */
const SCREEN_MODEL = 'Xenova/all-MiniLM-L6-v2';
let extractor = null;
async function screenRows(rows, status) {
  if (!extractor) {
    status('loading D1 screener (MiniLM q8, ~23 MB)…');
    const { pipeline, env } = await import(SCREEN_CDN);
    env.allowLocalModels = false;
    extractor = await pipeline('feature-extraction', SCREEN_MODEL, { dtype: 'q8' });
  }
  /* ONE TEXT PER FORWARD PASS, per CLAUDE.md's EMB1 rule: q8 pads every
     sequence in a batch out to the longest one in it, which shifts unrelated
     vectors by 0.003-0.008. The whole comparison here is between two cosines
     that can sit a few hundredths apart, so batching would manufacture exactly
     the signal being measured. */
  const vec = async (t) => {
    const o = await extractor([t], { pooling: 'mean', normalize: true });
    return o.data.slice(0, o.dims[1]);
  };
  const cos = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };
  for (let i = 0; i < rows.length; i++) {
    const { k, r, f } = rows[i];
    if (!r.txt) continue;
    status(`D1 screen ${i + 1}/${rows.length}…`);
    const vl = await vec(r.txt), vm = await vec(k.meaning), vq = await vec(k.q);
    r.simM = +cos(vl, vm).toFixed(3);
    r.simQ = +cos(vl, vq).toFixed(3);
    if (r.simQ > r.simM) f.flags.push('ANSWERS-QUESTION?');
  }
}

let running = false;
async function run(sanityOnly) {
  if (running) return;
  running = true; $('go').disabled = $('sanity').disabled = true;
  const model = modelSel.value, dtype = $('dtype').value, device = $('device').value;
  const which = $('prompt').value;
  const seatField = $('seattext').value, doScreen = $('screen').checked;
  const lib = $('lib').value;
  const status = m => { $('status').textContent = m; };
  const out = $('out');
  const head = document.createElement('div');
  head.innerHTML = `<h2>${esc(model)} · ${esc(dtype)} · ${esc(device)} · prompt ${esc(which)}` +
    ` · seat ${esc(seatField)} · lib ${esc(lib)}` +
    (sanityOnly ? ' · SANITY ONLY' : '') + `</h2><div id="live" class="dim">loading…</div>`;
  out.prepend(head);
  const live = head.querySelector('#live');

  let worker = null;
  try {
    /* Cases are built BEFORE the model loads. They are read out of the iframe,
       and if the draw page has not been built this throws — discovering that
       after downloading up to 1.3 GB, on a phone, is not a thing to do twice. */
    const cases = sanityOnly ? [] : buildCases(seatField);

    status('spawning worker…');
    /* Second half of the throttle: coalesce to one DOM write per frame. Even
       throttled, several progress messages can land inside a single frame on a
       fast connection, and a phone repainting a text node per message is the
       jank the worker was moved off the main thread to avoid. */
    let pending = null, praf = 0;
    worker = spawnWorker(p => {
      pending = p;
      if (praf) return;
      praf = requestAnimationFrame(() => {
        praf = 0;
        const q = pending;
        live.textContent = `${q.status || ''} ${q.file || ''} ` +
          `${q.pct ? q.pct.toFixed(0) + '%' : ''} · ${fmtMB(q.bytes || 0)} so far`;
      });
    }, LIBS[lib]);

    status('loading model…');
    const { loadMs, bytes, tmpl } = await worker.load(model, dtype, device);
    live.innerHTML = `<span class="ok">loaded</span> in ${loadMs} ms · download ${fmtMB(bytes)}`;

    const call = (system, user, maxTok) => worker.gen(system, user, maxTok);

    /* sanity FIRST: a model that fails here must not be judged on its lines */
    status('sanity…');
    const sane = [];
    for (const s of SANITY) {
      const r = await call('You answer in as few words as possible.', s.prompt, 24);
      sane.push({ id: s.id, pass: s.test(r.txt), garbage: isGarbage(r.txt), why: s.why, got: r.txt });
    }
    const passed = sane.filter(s => s.pass).length;
    const garbled = sane.filter(s => s.garbage).length;
    const numericsOk = garbled === 0;
    let html = `<p>load <b>${loadMs} ms</b> · download <b>${fmtMB(bytes)}</b> · ` +
      `sanity <b class="${passed === SANITY.length ? 'ok' : 'warn'}">${passed}/${SANITY.length}</b> · ` +
      `numerics <b class="${numericsOk ? 'ok' : 'bad'}">${numericsOk ? 'sound' : 'CORRUPT'}</b></p>` +
      `<table><tr><th>check</th><th>verdict</th><th>got</th></tr>` +
      sane.map(s => `<tr><td>${s.id}</td><td class="${s.pass ? 'ok' : s.garbage ? 'bad' : 'warn'}">` +
        `${s.pass ? 'pass' : s.garbage ? 'GARBAGE — ' + esc(s.why) : 'wrong (coherent)'}</td>` +
        `<td>${esc(s.got)}</td></tr>`).join('') +
      `</table>`;

    if (!numericsOk) {
      html += `<p class="bad">Numerics corrupt — output is a repeated token, not an answer. ` +
              `Do not report this configuration's card lines; try the other dtype, another lib ` +
              `version, or device wasm to confirm it is a WebGPU quantisation bug.</p>`;
    } else if (passed < SANITY.length) {
      html += `<p class="warn">Numerics look sound: the output is coherent English, it is just ` +
              `wrong. That is a capability limit, not corruption, and the card lines below are ` +
              `worth reading. Note Qwen3 with thinking disabled — which this bench does, to keep ` +
              `&lt;think&gt; blocks out of the word cap — is markedly weaker at arithmetic.</p>`;
    }

    if (!sanityOnly && numericsOk) {
      const cap = CAP[which];
      const rows = [];
      const ttfts = [], tpss = [];
      let estimated = false;
      for (let i = 0; i < cases.length; i++) {
        status(`case ${i + 1}/${cases.length}…`);
        live.textContent = `case ${i + 1}/${cases.length}`;
        const k = cases[i];
        /* 80, not 48. A 25-word line is ~35-40 tokens and 48 left almost no
           headroom, so a model that ran long was cut mid-sentence and read as
           terse — indistinguishable, with no flag, from a model that ended
           cleanly. Now it has room, and hitting the ceiling is reported. */
        const r = await call(SYS[which], k.user, 80);
        const f = flags(r.txt, k, cap);
        if (r.think) f.flags.push('THINK-BLOCK');
        if (r.truncated) f.flags.push('TRUNCATED');
        if (!r.counted) estimated = true;
        if (r.ttft) ttfts.push(r.ttft);
        tpss.push(r.tps);
        rows.push({ k, r, f });
      }
      if (doScreen) {
        try { await screenRows(rows, status); }
        catch (e) { live.innerHTML += `<br><span class="warn">D1 screen unavailable: ${esc(e.message)}</span>`; }
      }
      const med = a => a.length ? a.slice().sort((x, y) => x - y)[a.length >> 1] : null;
      const clean = rows.filter(x => !x.f.flags.length).length;
      /* TTFT is now criterion 4 for real: a TextStreamer with skip_prompt, so
         the clock stops on the first GENERATED token rather than partway
         through prompt processing. Tokens are counted, not estimated from
         characters. Both were wrong before and both were the same bug. */
      const susp = rows.filter(x => x.f.flags.includes('ANSWERS-QUESTION?')).length;
      html += `<p>TTFT median <b>${med(ttfts) ?? 'n/a'} ms</b> <span class="dim">(criterion 4: under ~400 ms on a mid-range phone)</span> · ` +
        `median <b>${med(tpss)} tok/s</b>${estimated ? ' <span class="warn">(estimated — token callback unavailable)</span>' : ''} · ` +
        `mechanically clean <b>${clean}/${rows.length}</b> · avg words ` +
        `<b>${(rows.reduce((s, x) => s + x.f.words, 0) / rows.length).toFixed(1)}</b>` +
        (doScreen ? ` · <span class="${susp ? 'warn' : 'ok'}">D1 suspicions <b>${susp}/${rows.length}</b></span>` : '') +
        ` · chat template: ${esc(tmpl)}</p>` +
        `<p class="dim">Criterion 1 (never contradicts the meaning) and criterion 5 (voice) are hand-judged. ` +
        `Read the meaning and the line side by side below. <b>sim</b> is cosine of the produced line ` +
        `against the meaning (m) and against the question (q) — q &gt; m is a hint that the model ` +
        `answered the question, not a verdict. Suspicious rows are listed first.</p>` +
        `<table><tr><th>card · seat</th><th>meaning → line</th><th>w</th><th>sim m/q</th><th>ms</th><th>flags</th></tr>` +
        rows.slice()
          .sort((a, b) => (b.f.flags.includes('ANSWERS-QUESTION?') ? 1 : 0) -
                          (a.f.flags.includes('ANSWERS-QUESTION?') ? 1 : 0))
          .map(({ k, r, f }) => `<tr>` +
          `<td>${esc(k.name)}${k.rev ? ' <i>rev</i>' : ''}<br><span class="dim">${esc(k.seat)}</span><br><span class="dim">“${esc(k.q)}”</span></td>` +
          `<td><span class="mean">${esc(k.meaning)}</span><br><span class="gold">${esc(r.txt)}</span></td>` +
          `<td>${f.words}</td>` +
          `<td>${r.simM === undefined ? '<span class="dim">—</span>' :
                `<span class="${r.simQ > r.simM ? 'bad' : 'dim'}">${r.simM.toFixed(2)} / ${r.simQ.toFixed(2)}</span>`}</td>` +
          `<td>${r.totalMs}</td>` +
          `<td class="${f.flags.length ? 'warn' : 'ok'}">${f.flags.join('<br>') || 'ok'}</td></tr>`).join('') +
        `</table>`;
    }
    live.innerHTML = html;
    status('done');
  } catch (e) {
    live.innerHTML = `<span class="bad">FAILED: ${esc(e.message || e)}</span>`;
    status('failed');
  } finally {
    /* Dispose BEFORE terminating, and do not let a wedged worker hang teardown:
       whichever comes first, the thread still dies. A session on a phone is
       many load/kill cycles of several hundred MB each, and terminate() on its
       own leaves ORT's GPU buffers to be collected whenever -- which is how a
       bench that ran fine for two models starts crashing the tab on the
       fourth. */
    if (worker) {
      try { await Promise.race([worker.free(), new Promise(r => setTimeout(r, 3000))]); }
      catch (_) {}
      worker.kill();
    }
    running = false; $('go').disabled = $('sanity').disabled = false;
  }
}

$('go').addEventListener('click', () => run(false));
$('sanity').addEventListener('click', () => run(true));

/* Results exist only in this tab's DOM. On a phone that makes them nearly
   impossible to get out by hand -- selecting a 12-row table with a thumb is
   not a thing anyone should have to do -- and the environment block is half
   the result, so it goes first. Tables are flattened to pipe-separated rows
   rather than innerText, which runs the cells together into gibberish. */
function resultsText() {
  const out = [];
  out.push('=== environment ===', $('env').innerText.trim(), '');
  for (const sec of document.getElementById('out').children) {
    const h = sec.querySelector('h2');
    if (h) out.push('=== ' + h.innerText.trim() + ' ===');
    let emitted = 0;
    for (const p of sec.querySelectorAll('p')) {
      const t = p.innerText.replace(/\s+/g, ' ').trim();
      if (t) { out.push(t); emitted++; }
    }
    for (const t of sec.querySelectorAll('table')) {
      out.push('');
      for (const r of t.rows) {
        out.push([...r.cells]
          .map(c => c.innerText.replace(/\s*\n\s*/g, ' · ').replace(/\s+/g, ' ').trim())
          .join(' | '));
      }
      emitted++;
    }
    /* A run that is still loading, or one that threw, has neither a <p> nor a
       <table> -- just text or a <span class="bad">FAILED: ...</span> in the
       live div. Emitting only p's and tables made both copy out as a bare
       header, which is worse than useless: it looks like a run that produced
       nothing rather than one that is mid-download or one that reported
       exactly why it died. The error IS the result in that case. */
    if (!emitted) {
      const live = sec.querySelector('div');
      const t = ((live || sec).innerText || '').replace(/\s+/g, ' ').trim();
      out.push(t ? '[no table — status: ' + t + ']'
                 : '[no output at all — run never reported]');
    }
    out.push('');
  }
  return out.join('\n');
}

$('copy').addEventListener('click', async () => {
  const t = resultsText();
  try {
    await navigator.clipboard.writeText(t);
    $('status').textContent = 'copied ' + t.length + ' chars';
  } catch (e) {
    /* Clipboard can be refused even on HTTPS. Fall back to something a thumb
       can actually work with rather than failing silently. */
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;inset:0;width:100%;height:70vh;z-index:9999;font:12px monospace';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    $('status').textContent = 'clipboard refused — select all in the box and copy';
  }
});
</script>
