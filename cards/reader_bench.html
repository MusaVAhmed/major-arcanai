/* The numeric sanity check the handoff insists on. There are ONNX Runtime Web
   overflow bugs that produce fluent-looking garbage at fp16 and q4f16 on
   WebGPU, so "it loaded and emitted English" is not a pass. None of these is
   about the deck; they are about whether the numerics survived quantisation.
   A model failing any of them must not be judged on its card lines at all. */
const SANITY = [
  { id: 'echo',   prompt: 'Repeat exactly this and nothing else: the quick brown fox',
    test: t => /quick brown fox/i.test(t), why: 'cannot follow a trivial instruction' },
  { id: 'arith',  prompt: 'What is 2 + 2? Answer with the number only.',
    test: t => /\b4\b|four/i.test(t), why: 'arithmetic broken — classic overflow symptom' },
  /* Deliberately tolerant of formatting. SmolLM2-135M answers this as
     "1. 2 / 2. 3 / 3. 4" — a mangled numbered list, not corrupted numerics,
     and an intolerant regex disqualified a model whose arithmetic was fine.
     The gate is for overflow garbage, so it asks only that 1, 2 and 3 appear
     in order somewhere in the digit stream. */
  { id: 'count',  prompt: 'List the first three positive integers, comma separated.',
    test: t => /1[\s\S]*2[\s\S]*3/.test(t.replace(/[^0-9]/g, '')) ||
               /one[\s\S]*two[\s\S]*three/i.test(t), why: 'sequence broken' },
];

/* GARBAGE IS NOT THE SAME AS WRONG, and the gate must not conflate them.
   Corrupted numerics produce a stream of one repeated token — Qwen2.5-0.5B at
   q4f16 on WebGPU answered all three checks with "!!!!!!!!" — and that is the
   thing the gate exists to catch. A model that answers "2" to 2 + 2 in fluent
   English has intact numerics and weak arithmetic, which is a different fact
   and must not disqualify it: Qwen3-0.6B does exactly this with thinking
   disabled, and disabling thinking is OUR doing (it is how the <think> blocks
   are kept out of the word cap). Failing it on that would reject a candidate
   for a limitation the bench itself imposed. */
/* ---- THE NUMERICS GATE, rewritten ----------------------------------------
   Its only job: decide whether a model's weights are producing valid tokens at
   all, so a human knows whether the card lines are worth reading. It is NOT a
   quality judgement. It got that wrong three times and each time the cost was
   the same — a working model rejected without its lines being generated:
     1. it only knew repetitive garbage, and passed twelve rows of multilingual
        token salad as "numerics sound";
     2. it counted an EMPTY answer as corruption, and rejected Phi-3-mini, which
        had spent its 24-token budget on a <thought> preamble;
     3. it counted a fenced SHELL BLOCK as corruption, and rejected
        Qwen2.5-1.5B, which had just answered 2+2 correctly.

   The design error was constant: asking "does this look wrong?" per output and
   treating anything unexpected as proof of corruption. But corruption is a
   property of the WEIGHTS, not of a prompt — numerics that emit salad cannot
   also do arithmetic. So:

     - classify each output as coherent / corrupt / empty, requiring POSITIVE
       evidence for each verdict rather than inferring from absence;
     - decide at the RUN level: one coherent output anywhere means the numerics
       work, whatever the other checks did.

   That inversion is what makes per-output strictness safe. A model may loop or
   refuse or preamble on one check; it cannot produce coherent English on any
   check if its numerics are broken. */
const COMMON = new Set(('the a an an and or but if to of in on at for with is are was were be been being it its ' +
  'this that these those you your yours i me my we our us they them their he she his her not no nor do does ' +
  'did done can could should would will shall have has had from as so what why how when where who whom which ' +
  'all any more most other some such only own same than too very just now then there here about into out up ' +
  'down over under again once still keep like get got go going make made take taken say said').split(' '));
const SCRIPTS = [/[Ѐ-ӿ]/, /[一-鿿]/, /[぀-ヿ]/, /[가-힯]/, /[؀-ۿ]/, /[฀-๿]/, /[֐-׿]/, /[ऀ-ॿ]/];

/* 'empty' | 'corrupt' | 'coherent' */
function classifyOutput(t) {
  const s = (t || '').trim();
  if (!s) return 'empty';

  // --- positive corruption signatures, in order of confidence ---
  const compact = s.replace(/\s+/g, '');
  if (/^(.)\1{5,}$/.test(compact)) return 'corrupt';            // "!!!!!!!!" — argmax stuck
  const toks = s.split(/\s+/);
  if (toks.length >= 6 && new Set(toks).size <= 2) return 'corrupt';   // one token looped
  const nonAscii = (s.match(/[^\x00-\x7F]/g) || []).length;
  if (s.length > 8 && nonAscii / s.length > 0.3) return 'corrupt';
  if (SCRIPTS.filter(re => re.test(s)).length >= 3) return 'corrupt';  // salad mixes scripts

  // --- positive coherence signals, before the last-resort statistic ---
  if (/```|^\s*[$#>]\s|\w+\(\)/.test(s)) return 'coherent';         // code is not garbage
  const words = s.toLowerCase().match(/[a-z']+/g) || [];
  if (words.length < 8) return 'coherent';   // too short to measure; "4", "1, 2, 3", "<thought>"

  /* Function-word ratio is the ONLY statistical test, applied last and only to
     text long enough to mean something. English prose runs a third to a half
     function words; salad runs near zero. */
  const ratio = words.filter(w => COMMON.has(w)).length / words.length;
  return ratio < 0.08 ? 'corrupt' : 'coherent';
}

/* Run-level verdict: 'sound' | 'CORRUPT' | 'NO OUTPUT'. */
function numericsVerdict(classes) {
  if (classes.includes('coherent')) return 'sound';
  if (classes.includes('corrupt')) return 'CORRUPT';
  return 'NO OUTPUT';           // everything empty — nothing generated at all
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
const fmtMB = b => (b / 1048576).toFixed(1) + ' MB';

const modelSel = $('model');
function fillModels(pairs) {
  modelSel.innerHTML = '';
  for (const [value, label] of pairs) {
    const o = document.createElement('option');
    o.value = value; o.textContent = label;
    modelSel.appendChild(o);
  }
}
fillModels(MODELS.map(m => [m, m]));

/* Switching engine reloads the model list, because the two engines do not share
   a model zoo. WebLLM's prebuilt list is read from the library itself rather
   than hardcoded, so the ids cannot go stale — and it carries vram_required_MB,
   which is the number that actually decides whether a handset will take it. */
$('engine').addEventListener('change', async () => {
  const eng = $('engine').value;
  const na = eng === 'webllm';
  $('dtype').disabled = na; $('lib').disabled = na; $('device').disabled = na;
  $('outfmt').disabled = !na;   // response_format is a WebLLM feature
  $('bias').disabled = !na;     // so is logit_bias
  $('think').disabled = !na;
  $('safe').disabled = !na;
  $('decode').disabled = !na;   // repetition/presence/frequency penalties too
  if (!na) { fillModels(MODELS.map(m => [m, m])); return; }
  fillModels([['', 'loading WebLLM model list…']]);
  try {
    const webllm = await import(WEBLLM_CDN);
    const list = (webllm.prebuiltAppConfig?.model_list || [])
      .filter(x => /q4f16/i.test(x.model_id))
      .sort((a, b) => (a.vram_required_MB || 0) - (b.vram_required_MB || 0))
      .map(x => [x.model_id, `${x.model_id} · ${x.vram_required_MB ? Math.round(x.vram_required_MB) + ' MB VRAM' : 'size ?'}` +
                             `${x.low_resource_required ? ' · low-resource' : ''}`]);
    fillModels(list.length ? list : [['', 'no q4f16 models in prebuilt list']]);
  } catch (e) {
    fillModels([['', 'model list failed: ' + (e.message || e)]]);
  }
});

/* The case set only means anything to the placement task; leaving it live on
   the rewrite task invites a run configured against a control that never ran. */
const syncTask = () => { $('pcases').disabled = $('task').value !== 'placement'; };
$('task').addEventListener('change', syncTask);
syncTask();

/* ---- environment, reported up front because it is half the result ---- */
let BENCH_BUILD = 'unknown';
(async () => {
  const bits = [];
  /* WHICH CODE IS ACTUALLY RUNNING. Three times this session a phone ran fresh
     model weights against stale JavaScript — twice from HTTP caching, once from
     pressing Run in a tab that was never reloaded — and each time the result was
     attributed to the code we believed was live. The page asks the server for
     its own Last-Modified and prints it in the env block AND in every run
     header, so a stale page is visible in the output rather than inferred three
     runs later. */
  try {
    const r = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
    const lm = r.headers.get('Last-Modified');
    if (lm) BENCH_BUILD = new Date(lm).toISOString().replace('T', ' ').slice(0, 19) + 'Z';
  } catch (_) {}
  bits.push('bench build: <b>' + esc(BENCH_BUILD) + '</b> — if this predates your last edit, RELOAD the page');
  bits.push('UA: ' + navigator.userAgent);
  bits.push('cores: ' + (navigator.hardwareConcurrency ?? '?') +
            ' · deviceMemory: ' + (navigator.deviceMemory ?? '?'));
  if (!('gpu' in navigator)) bits.push('<span class="bad">navigator.gpu ABSENT — no WebGPU. Any webgpu run will fail or silently fall back; do not report its numbers.</span>');
  else {
    try {
      const a = await navigator.gpu.requestAdapter();
      if (!a) bits.push('<span class="bad">navigator.gpu present but requestAdapter() returned NULL — no adapter. Perf numbers from this machine are meaningless.</span>');
      else {
        bits.push('<span class="ok">adapter: ' + esc([a.info?.vendor, a.info?.architecture, a.info?.description].filter(Boolean).join(' / ') || 'unnamed') +
                     '</span> · shader-f16: ' + (a.features?.has('shader-f16') ? 'yes' : '<span class="warn">NO — q4f16 will be slow or unavailable</span>'));
        /* The ceiling, reported BEFORE anything is downloaded. ORT dequantizes
           4-bit weights up to the compute precision on device, so a q4 (fp32
           compute) run needs roughly twice the device memory of the same model
           at q4f16 -- on top of a larger download. When a model downloads and
           then takes the tab with it, this is the number that predicted it, and
           there is no reason to learn it the expensive way. */
        const L = a.limits || {};
        const mb = (v) => v ? (v / 1048576).toFixed(0) + ' MB' : '?';
        bits.push('limits: maxStorageBufferBindingSize ' + mb(L.maxStorageBufferBindingSize) +
                  ' · maxBufferSize ' + mb(L.maxBufferSize) +
                  '<br><span class="dim">A model whose largest weight tensor exceeds the binding size will not run. ' +
                  'q4 needs ~2x the device memory of q4f16 for the same model: if q4f16 loads and q4 kills the tab, ' +
                  'it fits at fp16 and does not fit at fp32 — that is a result, not a bug.</span>');
      }
    } catch (e) { bits.push('<span class="bad">adapter error: ' + esc(e.message) + '</span>'); }
  }
  bits.push('Chrome Prompt API (Tier 1): ' + ('LanguageModel' in self
    ? '<span class="ok">present</span> — availability: ' + esc(await LanguageModel.availability().catch(e => 'ERR ' + e.message))
    : 'absent'));
  $('env').innerHTML = bits.join('<br>');
})();

/* ---- cases are read from the built page so they cannot drift ---- */
/* seatField picks which of the seat's two texts the model is shown. `prose` is
   what the handoff specified, but per CLAUDE.md prose is MATCHING text: written
   long and plain so a cosine can find it, and never displayed to anyone. `lens`
   is the display text and carries the deck's register. Feeding a model prose
   optimised to embed is a plausible contributor to output that reads flat, so
   it is an arm here rather than an assumption. */
/* ONE accessor for the draw page, because there are two builders now and the
   second one guessed the iframe's id wrong ('deck' for 'f') and died after the
   model had loaded. The page's top-level bindings are const, so DECK is
   invisible as a property and has to come through contentWindow.eval. */
function drawPage() {
  const w = $('f').contentWindow;
  let DECK, SEATS;
  try { DECK = w.eval('DECK'); SEATS = w.ARCANAI_SEATS; SEATS_ALL = SEATS; }
  catch (e) { throw new Error('could not read DECK from the draw page — is release/major-arcanai/index.html built? ' + e.message); }
  if (!SEATS) throw new Error('seats.js did not load in the draw page');
  const byName = {}; DECK.forEach(c => { byName[c.name] = c; });
  return { DECK, SEATS, byName };
}

function buildCases(seatField) {
  const { SEATS, byName } = drawPage();
  return CASES.map(([name, rev, mode, si, q]) => {
    const c = byName[name];
    if (!c) throw new Error('unknown card in CASES: ' + name);
    const seat = SEATS.seats[mode][si];
    // lens ends in a colon by design (it prefixes the meaning on the page);
    // that punctuation is meaningless mid-prompt, so drop it.
    const seatTxt = String(seat[seatField] || seat.prose || '').replace(/:\s*$/, '');
    return {
      name, rev: !!rev, seat: seat.label || seat.name, q,
      meaning: rev ? c.r : c.meaning,
      /* The expansion is in the prompt too, so it is copyable too — and it was
         the thing actually being copied. Carried on the case so flags() can
         see it. */
      sit: rev ? c.sitr : c.sit,
      user: `Card: ${c.name}${rev ? ', reversed' : ''}\n` +
            `Its meaning: ${rev ? c.r : c.meaning}\n` +
            `In practice: ${rev ? c.sitr : c.sit}\n` +
            `Position: ${seat.label || seat.name}, ${seatTxt}\n` +
            `They asked: ${q}\n` +
            `Rewrite the meaning for this position.`,
      /* F — the expansion removed, everything else byte-identical to `user`. */
      userNoSit: `Card: ${c.name}${rev ? ', reversed' : ''}\n` +
            `Its meaning: ${rev ? c.r : c.meaning}\n` +
            `Position: ${seat.label || seat.name}, ${seatTxt}\n` +
            `They asked: ${q}\n` +
            `Rewrite the meaning for this position.`,
      /* G — the question removed. */
      userNoQ: `Card: ${c.name}${rev ? ', reversed' : ''}\n` +
            `Its meaning: ${rev ? c.r : c.meaning}\n` +
            `In practice: ${rev ? c.sitr : c.sit}\n` +
            `Position: ${seat.label || seat.name}, ${seatTxt}\n` +
            `Rewrite the meaning for this position.`,
      /* H — the seat's proper-noun label removed, the lens kept. "The
         Obstacle, what's in the way" -> "what's in the way". */
      userLensOnly: `Card: ${c.name}${rev ? ', reversed' : ''}\n` +
            `Its meaning: ${rev ? c.r : c.meaning}\n` +
            `In practice: ${rev ? c.sitr : c.sit}\n` +
            `Position: ${seatTxt}\n` +
            `They asked: ${q}\n` +
            `Rewrite the meaning for this position.`,
      /* I — all three subtractions at once. Distinct from D (`userCompact`),
         which keeps the question and was built to shrink prefill memory rather
         than to remove copy sources. */
      userMinimal: `${rev ? c.r : c.meaning}\n` +
            `Position: ${seatTxt}\n` +
            `Rewrite it for this position.`,
      /* the same case as tagged fields — prompt E's anti-scaffold-echo test.
         Same content, same order, same words: only the delimiters change. */
      userTagged: `<card>${c.name}${rev ? ', reversed' : ''}</card>\n` +
            `<meaning>${rev ? c.r : c.meaning}</meaning>\n` +
            `<in_practice>${rev ? c.sitr : c.sit}</in_practice>\n` +
            `<position>${seat.label || seat.name}, ${seatTxt}</position>\n` +
            `<question>${q}</question>\n` +
            `Rewrite the meaning for this position.`,
      /* the same case with the expansion dropped — prompt D's memory test */
      userCompact: `${rev ? c.r : c.meaning}\n` +
            `Position: ${seatTxt}\n` +
            `They asked: ${q}\n` +
            `Rewrite it for this position.`,
    };
  });
}

/* ---- placement cases, built from the same live DECK and seats.js as the
   rewrite cases, so neither can drift from what ships. ---- */
const PLACE_SYS =
  "You assign tarot cards to positions in a spread.\n" +
  "You are given a question, some cards with their meanings, and the same number of positions.\n" +
  "Decide which card belongs in which position. Every card is used exactly once.\n" +
  "Answer only with the assignment. No explanation.";

function placementPrompt(kase, order) {
  /* `order` is the presentation order of the cards for this permutation. The
     LETTERS the model answers with are always A/B/C in seat order, so only the
     card side is permuted — permuting both at once would make a disagreement
     impossible to attribute. */
  const cards = order.map((ci, n) =>
    `${n + 1}. ${kase.cards[ci].name} — ${kase.cards[ci].meaning}`).join('\n');
  const seats = kase.seats.map((s, n) =>
    `${String.fromCharCode(65 + n)}. ${s.lens}`).join('\n');
  return `Question: ${kase.q}\n\nCards:\n${cards}\n\nPositions:\n${seats}\n\n` +
         `Assign each card number to one position letter.`;
}

/* The schema names the seat letters as keys and takes a card NUMBER, so a
   malformed answer is impossible rather than merely discouraged. Placement is
   machine-consumed data; this is the case structured output is actually for. */
/* STRING ENUMS, NOT AN INTEGER RANGE. `{type:'integer', minimum:1, maximum:n}`
   is not something a context-free grammar expresses naturally — a range has to
   become an explicit alternation before it can constrain decoding — and
   Qwen3-1.7B returned a bare `{` and stopped on 23 of 24 answers under it,
   with a 160-token budget, so it was not truncation. An enum is a literal
   alternation and needs no compilation cleverness. `parseAssign` already
   coerces with parseInt, so both shapes read back identically. */
function placementSchema(n) {
  const vals = [...Array(n).keys()].map(i => String(i + 1));
  const props = {}, req = [];
  for (let i = 0; i < n; i++) {
    const k = String.fromCharCode(65 + i);
    props[k] = { type: 'string', enum: vals };
    req.push(k);
  }
  return { type: 'object', properties: props, required: req, additionalProperties: false };
}

function buildPlacement(seatField, setName) {
  const set = PLACEMENT_SETS[setName] || PLACEMENT_SETS.real;
  const { SEATS, byName } = drawPage();
  return set.cases.map(([q, mode, names, truth]) => {
    /* A card is a deck name, or an inline [name, meaning] pair. The inline form
       is only used by the synthetic control; everything else must resolve
       against the built deck so a renamed card fails loudly rather than
       silently benchmarking a card that no longer exists. */
    const cards = names.map(n => {
      if (Array.isArray(n)) return { name: n[0], meaning: n[1] };
      const c = byName[n];
      if (!c) throw new Error('unknown card in ' + setName + ': ' + n);
      return { name: n, meaning: c.meaning };
    });
    const seats = (SEATS.seats[mode] || []).slice(0, cards.length).map(s => ({
      label: s.label || s.name,
      lens: String(s[seatField] || s.prose || '').replace(/:\s*$/, ''),
      prose: s.prose || '',
    }));
    if (seats.length !== cards.length)
      throw new Error(`mode ${mode} has ${seats.length} seats for ${cards.length} cards`);
    if (truth) {
      if (truth.length !== cards.length || new Set(truth).size !== cards.length)
        throw new Error(`truth for “${q}” is not a permutation of ${cards.length} cards`);
      /* Guard the scramble rule rather than trusting it to survive an edit: a
         control whose answer IS the identity presentation cannot distinguish a
         model that did the task from one that answered by slot. */
      if (truth.every((c, s) => c === s))
        throw new Error(`control “${q}” has an identity truth — scramble the card order`);
    }
    return { q, mode, cards, seats, truth: truth || null };
  });
}

/* Presentation orders. Identity first so run 1 is the plain case, then rotations
   and a reversal — fixed, not random, so two runs of the same build ask the same
   questions in the same orders. */
function permsFor(n) {
  const base = [...Array(n).keys()];
  const out = [base];
  for (let r = 1; r < n && out.length < PERMS; r++) out.push(base.map((_, i) => (i + r) % n));
  if (out.length < PERMS) out.push([...base].reverse());
  return out.slice(0, PERMS);
}

/* ---- automatic flags. These do NOT judge the reading; they catch the
   mechanical failures a post-filter would have to catch in speak.js, so the
   human only has to judge contradiction and voice. ---- */
const PREAMBLE = /^(here('s| is)\b|sure\b|okay\b|ok\b|certainly\b|of course\b|rewritten\b|rewrite:|response:|output:|answer:)/i;
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
function flags(text, kase, cap) {
  const f = [];
  const words = text ? text.trim().split(/\s+/).length : 0;
  if (!text.trim()) f.push('EMPTY');
  if (words > cap) f.push('OVER' + cap);
  if (PREAMBLE.test(text.trim())) f.push('PREAMBLE');
  if (/^["'“]/.test(text.trim())) f.push('WRAPPED-QUOTES');
  if (/["“”]/.test(text)) f.push('quotes');
  if (/[*_]{1,2}\w/.test(text)) f.push('MARKDOWN');
  if (/\.\.\.|…/.test(text)) f.push('ellipsis');
  if (/\n/.test(text.trim())) f.push('MULTILINE');
  /* A verbatim exemplar scores as clean: right length, no markdown, no quotes.
     Qwen3-0.6B returned the same exemplar for nine of twelve cards and scored
     10/12 clean on it. Copying the demonstration is not doing the task. */
  for (const [, , , , , line] of FEWSHOT_CASES) {
    const a = norm(text), b = norm(line);
    if (a && b && (a === b || a.includes(b) || (a.length > 12 && b.includes(a)))) { f.push('EXEMPLAR-ECHO'); break; }
  }
  if (new RegExp('^' + kase.seat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:', 'i').test(text.trim())) f.push('SEAT-LABEL-LEAK');
  /* The leak that the line-start rule missed, and it was half the residual
     failures: "You're in the Obstacle." — the seat named mid-sentence as a
     place. Capitalised only, for the same reason the logit_bias arm bans
     capitalised only: "the outcome is quiet" is a good line and "in the
     Outcome" is a leak, and the case is what separates them. Sentence-initial
     is excluded for the same reason the logit_bias arm excludes it: a capital
     after a full stop is grammar, not a proper noun, and "Hopes are cheap."
     is a line this deck would be glad to have written. */
  else {
    const distinct = kase.seat.split(/[^A-Za-z']+/).filter(w => w && !SEAT_STOP.has(w.toLowerCase()) && /^[A-Z]/.test(w));
    if (distinct.length && new RegExp('(?<![.!?]\\s)(?<!^)\\b(' + distinct.join('|') + ')\\b', 'm').test(text.trim())) f.push('SEAT-NAME-IN-LINE');
  }
  /* The prompt's own field labels coming back as output — "In practice: …
     Position: The Advice, what to do?". Both scaffolds are checked on every
     arm, so prompt E cannot score well merely by making its own echo
     invisible: if it echoes tags instead of labels, that is caught too. */
  if (/^\s*(card|its meaning|meaning|in practice|position|they asked|question)\s*:/im.test(text)
      || /<\/?(card|meaning|in_practice|position|question)>/i.test(text)) f.push('SCAFFOLD-ECHO');
  /* COPYING IS CHECKED AGAINST BOTH TEXTS IN THE PROMPT, and for a long time
     it was only checked against one. `NEAR-COPY` compared the line to the
     MEANING alone, so a row that reproduced the SITUATIONAL EXPANSION word for
     word scored a clean `ok` — and three of the baseline's seven clean rows
     were doing exactly that ("Caring loudly about not caring, spite, and
     energy spent proving you have moved on." is `last_flying_fuck`'s
     expansion with one "and" added). The metric was blind to the commonest
     failure in the run, which means every arm scored before this was scored
     generously and by the same amount.

     The two are separate flags because they mean different things: copying the
     meaning is failing to rewrite, copying the expansion is answering with the
     prompt's own examples. */
  /* SUBSTRING CONTAINMENT WAS TOO BRITTLE and let the real copies through. The
     model does not copy cleanly — it inserts a word ("spite, AND energy") or
     rewrites the opening ("A non apology" -> "You're in a non-apology"), and
     either one breaks `a.includes(b)` completely while leaving a line that is
     unmistakably the source text. Two of the three expansion copies escaped
     that way.

     Word-bag containment instead: what share of the OUTPUT's words appear
     anywhere in the source. Order-insensitive, so an inserted conjunction or a
     changed prefix costs a little rather than everything. Measured on eight
     real outputs, copies land 0.70-0.94 and genuine rewrites 0.00-0.55 — the
     bake-off's best line ("The outcome is quiet, the roommates are back to
     being roommates.") sits at 0.55 against the very expansion it echoes, so
     0.70 has real daylight on both sides. Lines under 8 words are not judged;
     a short line shares function words with everything. */
  const a = norm(text);
  const aw = a.split(' ').filter(Boolean);
  const near = (src) => {
    const b = norm(src || '');
    if (!a || !b) return false;
    if (a === b || (b.length > 12 && a.includes(b)) || (a.length > 12 && b.includes(a))) return true;
    if (aw.length < 8) return false;
    const bw = new Set(b.split(' ').filter(Boolean));
    return aw.filter(w => bw.has(w)).length / aw.length >= 0.70;
  };
  if (near(kase.meaning)) f.push('NEAR-COPY');
  if (near(kase.sit)) f.push('COPY-EXPANSION');
  // a 4-gram repeated three times is a degenerate loop, not a sentence
  const t = a.split(' ');
  for (let i = 0; i + 4 <= t.length; i++) {
    const g = t.slice(i, i + 4).join(' ');
    if (g.length > 8 && a.split(g).length - 1 >= 3) { f.push('REPETITION-LOOP'); break; }
  }
  // an English prompt should not come back mostly non-Latin
  const nonLatin = (text.match(/[^\x00-\x7F]/g) || []).length;
  if (text.length > 10 && nonLatin / text.length > 0.1) f.push('CHARSET-GARBAGE');
  return { words, flags: f };
}

/* ---- D1 pre-screen ---------------------------------------------------------
   The flags above catch mechanical junk. They cannot catch the failure that
   actually matters — the model answering the QUESTION instead of re-voicing the
   CARD, which is what "you're drifting, not cheating" was. That is hand-judged,
   and hand-judging 12 cases x 9 models x 3 prompts x 2 dtypes is how careful
   reading turns into skimming.

   So: embed the produced line and cosine it against the card's meaning and
   against the question. A line that sits closer to the question than to the
   meaning has drifted toward answering it. This is NOT a verdict — it is a
   sort order, so the suspicious lines get read first and the obvious passes
   last. Same model and dtype the page itself uses, so the screener is a tool
   this repo already trusts rather than a new dependency. */
const SCREEN_MODEL = 'Xenova/all-MiniLM-L6-v2';
let extractor = null;
async function screenRows(rows, status) {
  if (!extractor) {
    status('loading D1 screener (MiniLM q8, ~23 MB)…');
    const { pipeline, env } = await import(SCREEN_CDN);
    env.allowLocalModels = false;
    extractor = await pipeline('feature-extraction', SCREEN_MODEL, { dtype: 'q8' });
  }
  /* ONE TEXT PER FORWARD PASS, per CLAUDE.md's EMB1 rule: q8 pads every
     sequence in a batch out to the longest one in it, which shifts unrelated
     vectors by 0.003-0.008. The whole comparison here is between two cosines
     that can sit a few hundredths apart, so batching would manufacture exactly
     the signal being measured. */
  const vec = async (t) => {
    const o = await extractor([t], { pooling: 'mean', normalize: true });
    return o.data.slice(0, o.dims[1]);
  };
  const cos = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };
  for (let i = 0; i < rows.length; i++) {
    const { k, r, f } = rows[i];
    if (!r.txt) continue;
    status(`D1 screen ${i + 1}/${rows.length}…`);
    const vl = await vec(r.txt), vm = await vec(k.meaning), vq = await vec(k.q);
    r.simM = +cos(vl, vm).toFixed(3);
    r.simQ = +cos(vl, vq).toFixed(3);
    if (r.simQ > r.simM) f.flags.push('ANSWERS-QUESTION?');
  }
}

/* ---- logit_bias: ban first person at the token level -----------------------
   The 1B keeps writing "I'm not the problem" and "I'm not sure I'm ready to
   forgive you yet" — the deck speaking as the seeker instead of to them. That
   is not a shape a schema can forbid and not something prompt B's wording has
   managed to stop, but it IS a small set of tokens, and WebLLM exposes
   logit_bias.

   The token ids have to come from the model's own tokenizer, so this is
   coupled to the model family — transformers.js loads the tokenizer only (no
   weights), which is a few MB. An unknown family disables the arm rather than
   guessing ids, because biasing the wrong ids would silently ban arbitrary
   words and look like the model getting worse. */
const TOKENIZER_FOR = {
  'Llama-3.2-1B': 'onnx-community/Llama-3.2-1B-Instruct',
  'Llama-3.2-3B': 'onnx-community/Llama-3.2-3B-Instruct',
  'gemma3-1b': 'onnx-community/gemma-3-1b-it-ONNX',
  'Qwen3-0.6B': 'onnx-community/Qwen3-0.6B-ONNX',
};
const FIRST_PERSON = ["I", " I", "I'm", " I'm", " I've", " I'll", " my", " My", " me", " mine"];

async function firstPersonBias(modelId, note) {
  const famKey = Object.keys(TOKENIZER_FOR).find(k => modelId.includes(k));
  if (!famKey) { note('logit_bias: no tokenizer mapped for ' + modelId + ' — arm disabled'); return null; }
  const { AutoTokenizer } = await import(SCREEN_CDN);
  const tok = await AutoTokenizer.from_pretrained(TOKENIZER_FOR[famKey]);
  const ids = new Set();
  for (const s of FIRST_PERSON) {
    try {
      const enc = tok.encode(s, { add_special_tokens: false });
      /* Only single-token strings are banned. A multi-token encoding means the
         pieces are shared with other words, and banning those would take
         innocent vocabulary down with them. */
      if (enc.length === 1) ids.add(enc[0]);
    } catch (_) {}
  }
  if (!ids.size) { note('logit_bias: no single-token first-person forms found — arm disabled'); return null; }
  const bias = {};
  ids.forEach(id => { bias[String(id)] = -100; });
  note('logit_bias: banning ' + ids.size + ' first-person token(s) from ' + TOKENIZER_FOR[famKey]);
  return bias;
}

/* ---- logit_bias: ban the seat names, CAPITALISED ONLY ----------------------
   The 0.6B leaks the position into the line — "You're in the Obstacle.",
   "You're in the Vibe." — which is the same class of failure as the first
   person and yields to the same tool: it is a small, closed, enumerable set of
   tokens, and the set is not a guess because seats.js defines it.

   CAPITALISATION IS THE WHOLE TRICK, and without it this arm would be a net
   loss. The seat words are ordinary English — outcome, advice, present, future
   — and one of the best lines the bake-off ever produced was Qwen3-1.7B's "The
   outcome is quiet, the roommates are back to being roommates." Banning
   "outcome" outright would have killed it. But the leak always arrives as the
   proper noun ("in the Obstacle") and the legitimate use is always common
   ("the outcome is quiet"), and tokenizers give those two different ids. So
   only the capitalised forms are banned and the vocabulary survives.

   Function words are excluded explicitly: every seat label starts with "The",
   and banning " The" would take the model's grammar down with the leak. */
const SEAT_STOP = new Set(['the', 'a', 'an', 'of', 'and', 'or', 'in', 'on', 'to',
                           'what', 'why', 'how', 'is', 'it', 'its', 'you', 'your']);
function seatWords() {
  const out = new Set();
  /* SEATS_ALL, not SEATS: the seats are a local inside buildCases, and reading
     them from here threw "SEATS is not defined" — which the arm reported
     honestly and then ran without any bias at all, producing a row identical
     to baseline. Caught only because the two runs matched byte for byte. */
  const modes = (SEATS_ALL && SEATS_ALL.seats) || {};
  for (const mode of Object.keys(modes)) {
    for (const s of modes[mode] || []) {
      String(s.label || s.name || '').split(/[^A-Za-z']+/).forEach(w => {
        if (w && !SEAT_STOP.has(w.toLowerCase()) && /^[A-Z]/.test(w)) out.add(w);
      });
    }
  }
  return [...out];
}

async function seatNameBias(modelId, note) {
  const famKey = Object.keys(TOKENIZER_FOR).find(k => modelId.includes(k));
  if (!famKey) { note('logit_bias: no tokenizer mapped for ' + modelId + ' — seat arm disabled'); return null; }
  const words = seatWords();
  if (!words.length) { note('logit_bias: seats.js gave no seat words — seat arm disabled'); return null; }
  const { AutoTokenizer } = await import(SCREEN_CDN);
  const tok = await AutoTokenizer.from_pretrained(TOKENIZER_FOR[famKey]);
  const ids = new Set(); const kept = [], dropped = [];
  for (const w of words) {
    /* THE LEADING-SPACE FORM ONLY — the bare form is deliberately left alone.
       The 17 words seats.js yields are Past, Present, Future, Obstacle,
       Advice, Outcome, Hopes, Fears, Near, Root, Crown, Self, House and
       friends, and this deck writes blunt second-person imperatives: "Hopes
       are cheap." and "Past the point of caring." are lines it might
       legitimately produce, and banning the sentence-initial token would
       forbid them. Capitalisation mid-sentence is a proper noun and therefore
       the leak; capitalisation after a full stop is just grammar. Only the
       first is a signal.

       Single-token encodings only, as in the first-person arm: a multi-token
       encoding means the pieces are shared with innocent words. */
    const s = ' ' + w;
    try {
      const enc = tok.encode(s, { add_special_tokens: false });
      if (enc.length === 1) { ids.add(enc[0]); kept.push(s); }
      else dropped.push(s);
    } catch (_) {}
  }
  if (!ids.size) { note('logit_bias: no single-token capitalised seat words — seat arm disabled'); return null; }
  const bias = {};
  ids.forEach(id => { bias[String(id)] = -100; });
  note(`logit_bias: banning ${ids.size} capitalised seat token(s) — kept ${kept.map(s => JSON.stringify(s)).join(' ')}` +
       (dropped.length ? ` · skipped as multi-token ${dropped.map(s => JSON.stringify(s)).join(' ')}` : ''));
  return bias;
}

/* ---- placement scoring -----------------------------------------------------
   Three numbers, and the first two are the gate.

   AGREEMENT is pairwise: over every pair of presentation orders, the share of
   seats given the same card once the permutation is undone. Random assignment
   scores 1/n (0.33 at three cards); an order-invariant classifier scores 1.0.
   This is the measurement that says whether the model is deciding at all.

   IDENTITY RATE is the same answers before the permutation is undone: how
   often seat A got whatever was shown in slot 1, B slot 2, C slot 3. A model
   answering by position scores 1.0 here no matter how the cards are shuffled,
   and would look perfectly consistent on any metric that did not separate
   these two. High identity with high agreement is impossible unless the
   permutations are degenerate; high identity with LOW agreement is the
   signature of pure position bias.

   VALIDITY is whether the answer is a permutation at all. The schema bounds
   each value to 1..n but cannot express "all different", so a model can
   legally return the same card for two seats. */
function scorePlacement(assigns, n, truth) {
  const ok = assigns.filter(a => a && a.valid);
  let pairs = 0, same = 0;
  for (let i = 0; i < ok.length; i++)
    for (let j = i + 1; j < ok.length; j++) {
      for (let s = 0; s < n; s++) { pairs++; if (ok[i].canon[s] === ok[j].canon[s]) same++; }
    }
  const ident = assigns.filter(a => a && a.valid && a.raw.every((v, s) => v === s)).length;
  /* Accuracy is per SEAT, not per whole assignment, and only where a truth
     exists. Per-seat shares chance with `agree` (1/n), so the two sit in the
     same units and can be read side by side; all-or-nothing scoring would put
     chance at 1/n! and make three cards look far more impressive than they are.
     A control that scores at chance HERE is the capability verdict — order
     invariance cannot say that, which is why the controls exist. */
  let acc = null;
  if (truth && ok.length) {
    let hits = 0;
    for (const a of ok) for (let s = 0; s < n; s++) if (a.canon[s] === truth[s]) hits++;
    acc = hits / (ok.length * n);
  }
  return {
    agree: pairs ? same / pairs : null,
    identity: ok.length ? ident / ok.length : null,
    valid: assigns.length ? ok.length / assigns.length : 0,
    acc,
  };
}

/* Parse one answer. Returns raw (seat -> presentation slot) and canon (seat ->
   card index in the case's own order), or null if it is not a permutation. */
function parseAssign(txt, order, n) {
  let o;
  try { o = JSON.parse(String(txt).trim()); } catch (_) { return null; }
  if (!o || typeof o !== 'object') return null;
  const raw = [], canon = [];
  for (let s = 0; s < n; s++) {
    const v = o[String.fromCharCode(65 + s)];
    const slot = (typeof v === 'number' ? v : parseInt(v, 10)) - 1;
    if (!(slot >= 0 && slot < n)) return null;
    raw.push(slot);
    canon.push(order[slot]);          // undo the permutation
  }
  const valid = new Set(canon).size === n;
  return { raw, canon, valid };
}

let running = false;
async function run(sanityOnly) {
  if (running) return;
  running = true; $('go').disabled = $('sanity').disabled = true;
  const model = modelSel.value, dtype = $('dtype').value, device = $('device').value;
  const which = $('prompt').value;
  const seatField = $('seattext').value, doScreen = $('screen').checked;
  const lib = $('lib').value, engine = $('engine').value, outfmt = $('outfmt').value;
  const biasArm = $('bias').value, thinkVal = $('think').value, safeArm = $('safe').value;
  const decodeArm = $('decode').value, taskArm = $('task').value;
  const caseSet = $('pcases').value;
  const thinkArm = thinkVal === 'on';
  const status = m => { $('status').textContent = m; };
  const out = $('out');
  const head = document.createElement('div');
  head.innerHTML = `<h2>${esc(model)} · ` +
    (engine === 'webllm' ? 'WebLLM/MLC · webgpu' : `${esc(dtype)} · ${esc(device)} · lib ${esc(lib)}`) +
    (engine === 'webllm' && outfmt !== 'free' ? ' · ' + esc(outfmt) : '') +
    (engine === 'webllm' && biasArm !== 'off' ? ' · bias:' + esc(biasArm) : '') +
    (engine === 'webllm' && thinkVal !== 'off' ? ' · think:' + esc(thinkVal) : '') +
    (engine === 'webllm' && safeArm !== 'off' ? ' · mobile-safe' : '') +
    (taskArm !== 'rewrite' ? ' · <b>task:' + esc(taskArm) + '</b>' : '') +
    (decodeArm !== 'greedy' ? ' · decode:' + esc(decodeArm) : '') +
    (DECODE_REPRO[decodeArm] ? '' : ' <span class="warn">· SAMPLED, not reproducible</span>') +
    ` · prompt ${esc(which)} · seat ${esc(seatField)}` +
    ` <span class="dim">· build ${esc(BENCH_BUILD)}</span>` +
    (sanityOnly ? ' · SANITY ONLY' : '') + `</h2><div id="live" class="dim">loading…</div>`;
  out.prepend(head);
  const live = head.querySelector('#live');

  let worker = null;
  try {
    /* Cases are built BEFORE the model loads. They are read out of the iframe,
       and if the draw page has not been built this throws — discovering that
       after downloading up to 1.3 GB, on a phone, is not a thing to do twice. */
    const cases = sanityOnly ? []
                : taskArm === 'placement' ? buildPlacement(seatField, caseSet)
                : buildCases(seatField);

    status('spawning worker…');
    /* Second half of the throttle: coalesce to one DOM write per frame. Even
       throttled, several progress messages can land inside a single frame on a
       fast connection, and a phone repainting a text node per message is the
       jank the worker was moved off the main thread to avoid. */
    let pending = null, praf = 0;
    const onProg = (p) => {
      pending = p;
      if (praf) return;
      praf = requestAnimationFrame(() => {
        praf = 0;
        const q = pending;
        live.textContent = `${q.status || ''} ${q.file || ''} ` +
          `${q.pct ? q.pct.toFixed(0) + '%' : ''} · ${fmtMB(q.bytes || 0)} so far`;
      });
    };
    worker = engine === 'webllm' ? makeWebLLMEngine(onProg, WEBLLM_CDN)
                                 : spawnWorker(onProg, LIBS[lib]);

    status('loading model…');
    /* MOBILE-SAFE chatOpts. web-llm#485 reports coherent output on desktop and
       gibberish on mobile for the SAME model and prompt, and reports it for
       small models too (Phi-1.5/2/3, TinyLlama) once the prompt gets complex —
       so the trigger is prompt/prefill work, not parameter count, and the
       "1.4-2 GB ceiling" measured here may be a symptom rather than the cause.
       mlc-llm#3379 is specifically Qwen3-1.7B prefill on Android. Native MLC
       runs Llama-3.2-3B at 18-25 tok/s on this same silicon, so the hardware is
       not the limit.

       This arm shrinks the two things that make prefill allocate: the context
       window and the prefill chunk. If a model that produced token salad at
       defaults produces text at ctx 2048 / chunk 256, the ceiling is a
       configuration problem and the bigger models are back on the table. */
    const chatOpts = safeArm === 'mobile'
      ? { context_window_size: 2048, prefill_chunk_size: 256 }
      : undefined;
    const { loadMs, bytes, vram, tmpl } = await worker.load(model, dtype, device, chatOpts);
    const sizeTxt = bytes ? `download ${fmtMB(bytes)}`
                  : vram ? `${vram} MB VRAM (declared; WebLLM reports no byte count)`
                  : 'size unknown';
    live.innerHTML = `<span class="ok">loaded</span> in ${loadMs} ms · ${sizeTxt}`;

    const call = (system, user, maxTok, opts) => worker.gen(system, user, maxTok, opts);

    /* sanity FIRST: a model that fails here must not be judged on its lines */
    status('sanity…');
    const sane = [];
    for (const s of SANITY) {
      /* Sanity goes through the SAME thinking arm as the cases. It did not, and
         the phone's prefill run reported sanity 1/3 with <think> in the output
         while all twelve card rows were clean — the checks were measuring a
         configuration the run was not using, and made the model look worse than
         it is. A gate that does not match the run is not a gate. */
      /* 64, not 24. Phi-3-mini spends its budget on a <thought> preamble and
         never reaches the answer, which reads as failure when it is truncation.
         A sanity check that a verbose model cannot physically pass is measuring
         the budget. */
      /* The decode arm goes to the gate as well, for the reason the think arm
         does: a gate that does not match the run is not a gate. If a
         repetition penalty breaks the counting check, that is a real cost of
         the arm and it should be visible rather than hidden behind a greedy
         gate the run never used. The run-level verdict makes this safe — one
         coherent output anywhere still means the numerics are sound. */
      const r = await call('You answer in as few words as possible.', s.prompt, 64,
        { think: thinkVal === 'prefill' ? 'prefill' : thinkArm, decode: decodeArm });
      sane.push({ id: s.id, pass: s.test(r.txt), cls: classifyOutput(r.txt),
                  why: s.why, got: r.txt });
    }
    const passed = sane.filter(s => s.pass).length;
    const verdict = numericsVerdict(sane.map(s => s.cls));
    const numericsOk = verdict === 'sound';
    let html = `<p>load <b>${loadMs} ms</b> · <b>${esc(sizeTxt)}</b> · ` +
      `sanity <b class="${passed === SANITY.length ? 'ok' : 'warn'}">${passed}/${SANITY.length}</b> · ` +
      `numerics <b class="${numericsOk ? 'ok' : 'bad'}">${esc(verdict)}</b></p>` +
      `<table><tr><th>check</th><th>verdict</th><th>got</th></tr>` +
      sane.map(s => `<tr><td>${s.id}</td><td class="${s.pass ? 'ok' : s.cls === 'corrupt' ? 'bad' : 'warn'}">` +
        `${s.pass ? 'pass'
            : s.cls === 'corrupt' ? 'CORRUPT — ' + esc(s.why)
            : s.cls === 'empty' ? 'empty (no tokens produced)'
            : 'wrong (coherent)'}</td>` +
        `<td>${esc(s.got)}</td></tr>`).join('') +
      `</table>`;

    if (verdict === 'NO OUTPUT') {
      html += `<p class="bad">The model produced no tokens on any check. Not a corruption ` +
              `signature — it generated nothing at all. Card lines are not reported.</p>`;
    } else if (!numericsOk) {
      html += `<p class="bad">Numerics corrupt — no check produced coherent output. ` +
              `Do not report this configuration's card lines; try the other dtype, another lib ` +
              `version, or device wasm to confirm it is a WebGPU quantisation bug.</p>`;
    } else if (passed < SANITY.length) {
      html += `<p class="warn">Numerics sound — at least one check produced coherent output, `
            + `which broken weights cannot do. The failures below are capability or verbosity, `
            + `not corruption. Chat-tuned models decline the echo check, Phi-3 spends its `
            + `budget on a &lt;thought&gt; preamble, and Qwen3 with thinking suppressed is weak `
            + `at arithmetic. None of that is disqualifying — read the card lines.</p>`;
    }

    if (!sanityOnly && numericsOk && taskArm === 'placement') {
      const per = [];
      for (let i = 0; i < cases.length; i++) {
        const k = cases[i], n = k.cards.length, orders = permsFor(n);
        const assigns = [], texts = [];
        for (let p = 0; p < orders.length; p++) {
          status(`case ${i + 1}/${cases.length}, order ${p + 1}/${orders.length}…`);
          live.textContent = `case ${i + 1}/${cases.length} · order ${p + 1}/${orders.length}`;
          /* think:false ON PURPOSE, whatever the think selector says.
             `response_format` is a CHAT-completions field; WebLLM's raw
             completions API — which the prefill path uses — ignores it, and the
             first placement run came back 0% valid with the model echoing the
             prompt's own card and seat lists, exactly as it does on the rewrite
             task.

             Losing prefill costs nothing here, because the schema does the same
             job better: `<think>` is not in the grammar, so it cannot be
             emitted, and neither can an echo of the prompt. This is the
             inverse of the rewrite finding — a schema hurt the line because it
             constrained prose whose voice mattered; placement has no voice to
             damage, and the failure the schema forbids is the dominant one. */
          /* 512, and the history of this number is the finding. 64 truncated
             Qwen3-1.7B to a bare `{`; 160 was assumed to fix it and did not —
             Llama-3.2-3B came back 42% valid with the SAME bare `{`, which had
             been written off as a Qwen3 quirk. It is not model-specific and it
             is not the model failing the task: under constrained decoding the
             grammar permits unbounded whitespace between tokens, so a model
             inclined to pretty-print spends its whole budget on newlines and
             indentation before reaching a key. 0.6B fitting in 64 was never
             evidence that 64 was enough — it just does not pretty-print.

             THE FAILURE LOOKS EXACTLY LIKE INCAPACITY, which is why it survived
             two runs: an empty object is what a model that cannot answer would
             also produce. `rawlen` below exists so the two can be told apart
             without another run. */
          const r = await call(PLACE_SYS, placementPrompt(k, orders[p]), 512,
            { jsonRaw: placementSchema(n), decode: decodeArm, think: false });
          if (r.error) { assigns.push(null); texts.push('ERR ' + r.error); continue; }
          const a = parseAssign(r.txt, orders[p], n);
          assigns.push(a);
          /* The raw fallback is flattened to one line: it shares a cell with
             the parsed answers, which are one per line, and a multi-line
             failure was indistinguishable from four separate ones. */
          /* An unparsed answer reports its RAW LENGTH and its whitespace, because
             collapsing `\s+` to a space is what disguised the budget bug as a
             model failure: `{` followed by 400 characters of indentation and
             `{` on its own print identically once whitespace is normalised. */
          const raw = String(r.txt == null ? '' : r.txt);
          texts.push(a ? a.canon.map(ci => k.cards[ci].name.replace(/^The /, '')).join(' / ')
                       : `[unparsed, ${raw.length} chars trimmed / ${r.rawLen} raw, ` +
                         `${r.tokens} tok${r.truncated ? ' TRUNCATED' : ''}] ` +
                         raw.replace(/\n/g, '\\n').replace(/ /g, '·').slice(0, 60));
        }
        per.push({ k, assigns, texts, s: scorePlacement(assigns, n, k.truth) });
      }
      const mean = (f) => {
        const xs = per.map(f).filter(x => x != null);
        return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
      };
      const pct = (x) => x == null ? '—' : (x * 100).toFixed(0) + '%';
      const nCards = cases[0] ? cases[0].cards.length : 3;
      const chance = 1 / nCards;
      const agree = mean(x => x.s.agree), ident = mean(x => x.s.identity);
      const acc = mean(x => x.s.acc), hasTruth = acc != null;
      /* The verdict is about the GATE, not about quality. Agreement at chance
         means the assignment carries no information and nothing downstream is
         worth measuring; high identity alongside it names the reason. */
      const decides = agree != null && agree > chance + 0.15;
      /* WHERE A TRUTH EXISTS, ACCURACY OUTRANKS AGREEMENT, and the four-way
         split is the entire reason the controls were built:
           accurate            -> it can do the task; the real cases are the problem
           consistent, wrong   -> it has a rule, and the rule is wrong
           accurate, unstable  -> impossible; a bug in the scoring, not a finding
           neither             -> capability, and no prompt is going to fix it */
      const accGood = hasTruth && acc > chance + 0.15;
      html += `<p>case set <b>${esc((PLACEMENT_SETS[caseSet] || {}).label || caseSet)}</b> · ` +
        `orders per case <b>${PERMS}</b> · valid answers <b>${pct(mean(x => x.s.valid))}</b> · ` +
        `<b>agreement ${pct(agree)}</b> (chance ${pct(chance)}) · ` +
        (hasTruth ? `<b>accuracy ${pct(acc)}</b> (chance ${pct(chance)}, per seat) · ` : '') +
        `identity ${pct(ident)} <span class="dim">(share answering slot-for-seat before the shuffle is undone)</span></p>`;
      if (hasTruth) {
        html += `<p class="${accGood ? 'ok' : 'bad'}">${accGood
          ? 'CONTROL PASSED — the model can do closed-set assignment when the answer exists. ' +
            'A chance score on the real cases therefore indicts the CASES, not the model: ' +
            'those seats may have no determinate answer for this deck.'
          : 'CONTROL FAILED — it cannot place cards even where the seat is stated in the ' +
            'card\'s own words. This is a capability limit, and no amount of prompt work on ' +
            'the real cases is going to reach past it.'}</p>` +
          `<p class="dim">Agreement is reported beside it and is diagnostic, not the verdict: ` +
          `consistent-but-wrong (${pct(agree)} agree, ${pct(acc)} accurate) means the model has a ` +
          `rule and the rule is wrong, which is a different problem from guessing.</p>`;
      } else {
        html += `<p class="${decides ? 'ok' : 'bad'}">${decides
          ? 'Order-invariant enough to be deciding something. Worth scoring against the cosine seating.'
          : 'AGREEMENT AT OR NEAR CHANCE — the model is not classifying, it is guessing. ' +
            'A high identity rate beside this means it is answering by position, not by content. ' +
            'Do not report placement quality from this run.'}</p>` +
          `<p class="dim">These cases carry no known answer, so this is a consistency result only. ` +
          `Chance here is ambiguous between a model that cannot choose and cases that cannot be ` +
          `chosen between — run the controls to tell those apart.</p>`;
      }
      html += `<table><tr><th>question</th><th>seats</th><th>assignment per order (undone)</th>` +
        (hasTruth ? `<th>correct</th>` : '') + `<th>agree</th>` +
        (hasTruth ? `<th>acc</th>` : '') + `<th>ident</th></tr>` +
        per.map(({ k, texts, s }) => `<tr>` +
          `<td>“${esc(k.q)}”</td>` +
          `<td class="dim">${k.seats.map(x => esc(x.label)).join('<br>')}</td>` +
          `<td>${texts.map(t => `<span class="gold">${esc(t)}</span>`).join('<br>')}</td>` +
          (hasTruth ? `<td class="dim">${k.truth.map(ci =>
              esc(k.cards[ci].name.replace(/^The /, ''))).join('<br>')}</td>` : '') +
          `<td class="${s.agree > chance + 0.15 ? 'ok' : 'warn'}">${pct(s.agree)}</td>` +
          (hasTruth ? `<td class="${s.acc > chance + 0.15 ? 'ok' : 'bad'}">${pct(s.acc)}</td>` : '') +
          `<td>${pct(s.identity)}</td></tr>`).join('') +
        `</table>`;
      live.innerHTML = html;
    } else if (!sanityOnly && numericsOk) {
      const cap = CAP[which];
      let logitBias = null;
      if (engine === 'webllm' && biasArm !== 'off') {
        status('building logit_bias…');
        const note = (m) => { html += `<p class="dim">${esc(m)}</p>`; };
        try {
          const parts = [];
          if (biasArm === 'nofirst' || biasArm === 'both') parts.push(await firstPersonBias(model, note));
          if (biasArm === 'noseat'  || biasArm === 'both') parts.push(await seatNameBias(model, note));
          const merged = Object.assign({}, ...parts.filter(Boolean));
          logitBias = Object.keys(merged).length ? merged : null;
        }
        catch (e) { html += `<p class="warn">logit_bias unavailable: ${esc(e.message || e)}</p>`; }
      }
      const rows = [];
      const ttfts = [], tpss = [];
      let estimated = false, errs = 0, aborted = null;
      for (let i = 0; i < cases.length; i++) {
        status(`case ${i + 1}/${cases.length}…`);
        live.textContent = `case ${i + 1}/${cases.length}`;
        const k = cases[i];
        /* 80, not 48. A 25-word line is ~35-40 tokens and 48 left almost no
           headroom, so a model that ran long was cut mid-sentence and read as
           terse — indistinguishable, with no flag, from a model that ended
           cleanly. Now it has room, and hitting the ceiling is reported. */
        const userMsg = k[USER_FIELD[which] || 'user'];
        const r = await call(SYS[which], userMsg, thinkArm ? 1024 : 80,
          { json: outfmt === 'free' ? null : outfmt, maxChars: cap * 6, logitBias,
            fewshot: which === 'C' ? FEWSHOT_TURNS : null, decode: decodeArm,
            think: thinkVal === 'prefill' ? 'prefill' : thinkArm });
        if (r.error) {
          /* Keep going. A run that dies on case 7 still knows something about
             cases 1-6, and the failures are worth counting in their own right. */
          rows.push({ k, r: { txt: '', totalMs: 0, err: r.error },
                      f: { words: 0, flags: ['RUN-ERROR'] } });
          errs++;
          if (errs >= 4) { aborted = `aborted after ${errs} generation failures`; break; }
          continue;
        }
        const f = flags(r.txt, k, cap);
        if (r.think) f.flags.push('THINK-BLOCK');
        if (r.truncated) f.flags.push('TRUNCATED');
        if (r.jsonFail) f.flags.push('JSON-FAIL');
        if (!r.counted) estimated = true;
        if (r.ttft) ttfts.push(r.ttft);
        tpss.push(r.tps);
        rows.push({ k, r, f });
      }
      if (doScreen) {
        try { await screenRows(rows.filter(x => !x.r.err), status); }
        catch (e) { live.innerHTML += `<br><span class="warn">D1 screen unavailable: ${esc(e.message)}</span>`; }
      }
      const med = a => a.length ? a.slice().sort((x, y) => x - y)[a.length >> 1] : null;
      const clean = rows.filter(x => !x.f.flags.length).length;
      /* TTFT is now criterion 4 for real: a TextStreamer with skip_prompt, so
         the clock stops on the first GENERATED token rather than partway
         through prompt processing. Tokens are counted, not estimated from
         characters. Both were wrong before and both were the same bug. */
      const susp = rows.filter(x => x.f.flags.includes('ANSWERS-QUESTION?')).length;
      if (errs) {
        html += `<p class="bad">${errs}/${rows.length} generations FAILED` +
          (aborted ? ' — ' + esc(aborted) : '') + `. The surviving rows are still ` +
          `reported below; a run that dies partway still knows something about the cases ` +
          `that completed. First error: ${esc((rows.find(x => x.r.err) || {r:{}}).r.err || '')}</p>`;
      }
      html += `<p>TTFT median <b>${med(ttfts) ?? 'n/a'} ms</b> <span class="dim">(criterion 4: under ~400 ms on a mid-range phone)</span> · ` +
        `median <b>${med(tpss)} tok/s</b>${estimated ? ' <span class="warn">(estimated — token callback unavailable)</span>' : ''} · ` +
        `mechanically clean <b>${clean}/${rows.length}</b> · avg words ` +
        `<b>${(rows.reduce((s, x) => s + x.f.words, 0) / rows.length).toFixed(1)}</b>` +
        (doScreen ? ` · <span class="${susp ? 'warn' : 'ok'}">D1 suspicions <b>${susp}/${rows.length}</b></span>` : '') +
        ` · chat template: ${esc(tmpl)}</p>` +
        `<p class="dim">Criterion 1 (never contradicts the meaning) and criterion 5 (voice) are hand-judged. ` +
        `Read the meaning and the line side by side below. <b>sim</b> is cosine of the produced line ` +
        `against the meaning (m) and against the question (q) — q &gt; m is a hint that the model ` +
        `answered the question, not a verdict. Suspicious rows are listed first.</p>` +
        `<table><tr><th>card · seat</th><th>meaning → line</th><th>w</th><th>sim m/q</th><th>ms</th><th>flags</th></tr>` +
        rows.slice()
          .sort((a, b) => (b.f.flags.includes('ANSWERS-QUESTION?') ? 1 : 0) -
                          (a.f.flags.includes('ANSWERS-QUESTION?') ? 1 : 0))
          .map(({ k, r, f }) => `<tr>` +
          `<td>${esc(k.name)}${k.rev ? ' <i>rev</i>' : ''}<br><span class="dim">${esc(k.seat)}</span><br><span class="dim">“${esc(k.q)}”</span></td>` +
          `<td><span class="mean">${esc(k.meaning)}</span><br>` +
          (r.err ? `<span class="bad">${esc(r.err)}</span>` : `<span class="gold">${esc(r.txt)}</span>`) + `</td>` +
          `<td>${f.words}</td>` +
          `<td>${r.simM === undefined ? '<span class="dim">—</span>' :
                `<span class="${r.simQ > r.simM ? 'bad' : 'dim'}">${r.simM.toFixed(2)} / ${r.simQ.toFixed(2)}</span>`}</td>` +
          `<td>${r.totalMs}</td>` +
          `<td class="${f.flags.length ? 'warn' : 'ok'}">${f.flags.join('<br>') || 'ok'}</td></tr>`).join('') +
        `</table>`;
    }
    live.innerHTML = html;
    status('done');
  } catch (e) {
    const msg = String(e.message || e);
    /* Dawn's device-loss message is unactionable as written, and it is the one
       most likely to be hit here: a tab that has already been killed by an OOM
       leaves the GPU process degraded, and a device lost that way does NOT come
       back on a tab reload. Say so, because the obvious response (reload and
       try again) is the one that cannot work. */
    let hint = '';
    if (/external Instance reference|device is lost|Device is lost|device was lost/i.test(msg)) {
      hint = `<p class="warn">That is a lost WebGPU device, not a bad model. It usually follows an ` +
             `earlier OOM in the same browser session, and <b>a tab reload will not fix it</b> — ` +
             `fully quit the browser (clear it from recents) and make this run the first one on a ` +
             `fresh page. If it fails identically on a clean start, the fault is the kernel or the ` +
             `adapter rather than the session, and that is a real result.</p>`;
    } else if (/create session|GetIndexFromName|graph/i.test(msg)) {
      hint = `<p class="warn">That is a session-creation failure: this model's ONNX export and this ` +
             `library version disagree about the graph. Try the other lib version — it is a ` +
             `model/runtime pairing problem, not a device or dtype problem.</p>`;
    }
    /* class "fatal" as well as "bad", and resultsText keys on "fatal". `bad`
       is also the sim column's highlight for a q>m row, so a plain
       `span.bad` lookup matched the FIRST such row and copied a similarity
       score out as though it were the run's error line. Every result pasted
       from the phone carried a stray "0.36 / 0.37" at the top of the section.
       The failure line needs a class nothing else wears. */
    live.innerHTML = `<span class="bad fatal">FAILED: ${esc(msg)}</span>` + hint;
    status('failed');
  } finally {
    /* Dispose BEFORE terminating, and do not let a wedged worker hang teardown:
       whichever comes first, the thread still dies. A session on a phone is
       many load/kill cycles of several hundred MB each, and terminate() on its
       own leaves ORT's GPU buffers to be collected whenever -- which is how a
       bench that ran fine for two models starts crashing the tab on the
       fourth. */
    if (worker) {
      try { await Promise.race([worker.free(), new Promise(r => setTimeout(r, 3000))]); }
      catch (_) {}
      worker.kill();
    }
    running = false; $('go').disabled = $('sanity').disabled = false;
  }
}

$('go').addEventListener('click', () => run(false));
$('sanity').addEventListener('click', () => run(true));

/* Results exist only in this tab's DOM. On a phone that makes them nearly
   impossible to get out by hand -- selecting a 12-row table with a thumb is
   not a thing anyone should have to do -- and the environment block is half
   the result, so it goes first. Tables are flattened to pipe-separated rows
   rather than innerText, which runs the cells together into gibberish. */
function resultsText() {
  const out = [];
  out.push('=== environment ===', $('env').innerText.trim(), '');
  for (const sec of document.getElementById('out').children) {
    const h = sec.querySelector('h2');
    if (h) out.push('=== ' + h.innerText.trim() + ' ===');
    /* The error line is a <span class="fatal">, and it is emitted FIRST and
       unconditionally. Twice now the copy has swallowed it: once because only
       p's and tables were extracted, and again because the remediation hint
       added beside it is a <p>, which made the section look like it had
       reported properly. The message is the whole result of a failed run --
       "it failed" without the reason costs a round trip every time. */
    const err = sec.querySelector('span.fatal');
    if (err) {
      const t = err.innerText.replace(/\s+/g, ' ').trim();
      if (t) out.push(t);
    }
    let emitted = 0;
    for (const p of sec.querySelectorAll('p')) {
      const t = p.innerText.replace(/\s+/g, ' ').trim();
      if (t) { out.push(t); emitted++; }
    }
    for (const t of sec.querySelectorAll('table')) {
      out.push('');
      for (const r of t.rows) {
        out.push([...r.cells]
          .map(c => c.innerText.replace(/\s*\n\s*/g, ' · ').replace(/\s+/g, ' ').trim())
          .join(' | '));
      }
      emitted++;
    }
    /* A run that is still loading, or one that threw, has neither a <p> nor a
       <table> -- just text or a <span class="bad">FAILED: ...</span> in the
       live div. Emitting only p's and tables made both copy out as a bare
       header, which is worse than useless: it looks like a run that produced
       nothing rather than one that is mid-download or one that reported
       exactly why it died. The error IS the result in that case. */
    if (!emitted) {
      const live = sec.querySelector('div');
      const t = ((live || sec).innerText || '').replace(/\s+/g, ' ').trim();
      out.push(t ? '[no table — status: ' + t + ']'
                 : '[no output at all — run never reported]');
    }
    out.push('');
  }
  return out.join('\n');
}

$('copy').addEventListener('click', async () => {
  const t = resultsText();
  try {
    await navigator.clipboard.writeText(t);
    $('status').textContent = 'copied ' + t.length + ' chars';
  } catch (e) {
    /* Clipboard can be refused even on HTTPS. Fall back to something a thumb
       can actually work with rather than failing silently. */
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;inset:0;width:100%;height:70vh;z-index:9999;font:12px monospace';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    $('status').textContent = 'clipboard refused — select all in the box and copy';
  }
});
</script>
