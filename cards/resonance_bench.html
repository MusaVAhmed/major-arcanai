<!doctype html>
<meta charset="utf-8">
<title>ArcanAI — resonance bench (WP2)</title>
<!--
  Not shipped. Serve the repo root and open /cards/resonance_bench.html.

  Drives the REAL draw page in an iframe rather than re-implementing any of
  selection, because a harness that reimplements weightedOrder stops measuring
  the deck the moment either copy drifts. The page's top-level bindings are
  `const`, so they are invisible as `frame.contentWindow.X` — but they are in
  scope for `contentWindow.eval`, which is how every probe below reaches them.

  Determinism: the page seeds from an entropy pool and the clock, which is
  right for a seeker and useless for a bench. Here the spreads are sampled
  with a local mulberry32 over the page's own weightedOrder/seatByAffinity, so
  the same SEED gives the same 200 spreads on every run.
-->
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; background:#141311; color:#e9e3d3; margin:0; padding:1rem 1.2rem; }
  h1 { font-size:1rem; letter-spacing:.08em; text-transform:uppercase; color:#9a927f; }
  iframe { position:fixed; left:-9999px; width:900px; height:1200px; }
  pre { white-space:pre-wrap; }
  .bar { color:#c9a44a; }
  button { font:inherit; background:#23201a; color:#e9e3d3; border:1px solid #3b372c; padding:.4rem .8rem; cursor:pointer; }
</style>
<h1>Resonance bench</h1>
<p><button id="go">Run</button> <span id="status">idle</span></p>
<pre id="out"></pre>
<iframe id="f" src="../release/major-arcanai/index.html"></iframe>

<script>
const SEED = 20260803;      // change to resample; fixed so runs are comparable
const DRAWS = 200;          // total spreads
const MODE = 3;

/* The question set. Deliberately ordinary: these are the shapes people type,
   not the shapes that flatter the deck. Spread across the six anchors. */
const QUESTIONS = [
  'should I quit my job',
  'does he still think about me',
  'why do I keep doing this to myself',
  'should I tell my mother how I feel',
  'am I going to be okay after the funeral',
  'is it too late to start over somewhere new',
  'will the money sort itself out',
  'should I text her back',
  'am I the problem in this friendship',
  'is this relationship worth saving',
  'should I go back to school',
  'why am I so tired all the time',
];

const out = document.getElementById('out');
const status = document.getElementById('status');
const log = (s) => { out.textContent += s + '\n'; };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const pct = (x) => (100 * x).toFixed(1) + '%';
function stats(xs) {
  if (!xs.length) return null;
  const s = [...xs].sort((a, b) => a - b);
  const mean = xs.reduce((a, b) => a + b, 0) / xs.length;
  const q = (p) => s[Math.min(s.length - 1, Math.floor(p * s.length))];
  return { n: xs.length, mean: +mean.toFixed(2), min: +s[0].toFixed(2),
           p10: +q(.10).toFixed(2), p50: +q(.50).toFixed(2), p90: +q(.90).toFixed(2),
           max: +s[s.length - 1].toFixed(2) };
}
function histogram(xs, lo, hi, bins) {
  const h = new Array(bins).fill(0);
  xs.forEach((x) => { const b = Math.max(0, Math.min(bins - 1, Math.floor((x - lo) / (hi - lo) * bins))); h[b]++; });
  const w = Math.max(...h) || 1;
  return h.map((c, i) => {
    const a = (lo + (hi - lo) * i / bins).toFixed(1).padStart(5);
    return `  ${a}  ${'█'.repeat(Math.round(28 * c / w)).padEnd(28)} ${c}`;
  }).join('\n');
}

document.getElementById('go').addEventListener('click', run);

async function run() {
  out.textContent = '';
  const W = document.getElementById('f').contentWindow;
  const ev = (src) => W.eval(src);

  status.textContent = 'waiting for the model…';
  ev('ARCANAI_ATTUNE.readFor("warm up the model", 3, 60000).catch(function(){})');
  for (let i = 0; i < 240 && !ev('ARCANAI_ATTUNE.ready'); i++) await new Promise(r => setTimeout(r, 500));
  if (!ev('ARCANAI_ATTUNE.ready')) { status.textContent = 'model never armed'; return; }

  const bg = ev('JSON.stringify(ARCANAI_ATTUNE.bg)');
  log('background cosine distribution (cross-card face pairs)');
  log('  ' + bg);
  log('');

  const rng = mulberry32(SEED);
  const per = Math.ceil(DRAWS / QUESTIONS.length);
  const all = { z: [], strong: [], tense: [], cohesion: [], revShare: [], gap: [] };
  const domCount = {};
  const verdicts = [];
  let n = 0;

  for (const q of QUESTIONS) {
    status.textContent = 'reading: ' + q;
    // one embedding per question, reused for every spread of it
    ev(`window.__q = ${JSON.stringify(q)};`);
    const ok = await ev(`(async () => {
      window.__sem = await ARCANAI_ATTUNE.readFor(window.__q, ${MODE}, 30000);
      window.__qv  = await ARCANAI_ATTUNE.vecFor(window.__q, 30000);
      return !!(window.__sem && window.__qv);
    })()`);
    if (!ok) { log('!! no read for ' + q); continue; }
    const dom = ev('window.__sem.dom && window.__sem.dom.k') || 'none';
    domCount[dom] = (domCount[dom] || 0) + 1;

    for (let k = 0; k < per && n < DRAWS; k++, n++) {
      const seed = Math.floor(rng() * 2 ** 31);
      /* the page's own selection, driven by a seed we control */
      const r = ev(`(function () {
        var rng = makeRng('bench') , s = ${seed} >>> 0;
        rng = (function (a) { return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })(s);
        var sem = window.__sem;
        var drawn = weightedOrder(rng, sem.w).slice(0, ${MODE});
        var seatTemp = LEANS[lean] * (ARCANAI_CFG().seatRatio || 0.34);
        var seated = (sem.pos.length === ${MODE}) ? seatByAffinity(rng, drawn, sem.pos, seatTemp) : drawn;
        var idxs = seated.map(function (c) { return IDX.get(c.name); });
        var revs = idxs.map(function (ci) {
          var f = sem.rev[ci]; return f === -1 ? rng() < 0.5 : f === 1; });
        var res = ARCANAI_ATTUNE.resonanceOf(idxs, revs, window.__qv);
        /* run the REAL verdict path: it reads CUR and QV, so stand them up */
        CUR = seated.map(function (c, i) {
          return Object.assign({}, c, { rev: revs[i], label: LABELS[${MODE}][i] || '' }); });
        QV = window.__qv;
        var verdict = resonantVerdict(resonance()) || tagVerdict();
        return JSON.stringify({ names: seated.map(function (c) { return c.name; }),
                                revs: revs, res: res, verdict: verdict });
      })()`);
      const { res, verdict } = JSON.parse(r);
      if (!res) { log('!! no resonance'); continue; }
      verdicts.push(verdict || '');
      res.pairs.forEach((p) => all.z.push(p.z));
      all.strong.push(res.strongest.z);
      all.tense.push(res.tensest.z);
      all.cohesion.push(res.cohesion);
      all.revShare.push(res.revShare);
      all.gap.push(+(res.strongest.z - res.tensest.z).toFixed(2));
    }
  }

  log(`${n} spreads of ${MODE}, ${QUESTIONS.length} questions, seed ${SEED}`);
  log('');
  const rows = [['every pair z', all.z], ['strongest pair z', all.strong],
                ['tensest pair z', all.tense], ['cohesion (mean z)', all.cohesion],
                ['strong-tense gap', all.gap], ['reversal share', all.revShare]];
  rows.forEach(([name, xs]) => log(name.padEnd(20) + JSON.stringify(stats(xs))));
  log('');
  log('distribution of every pair z');
  log(histogram(all.z, -3, 5, 16));
  log('');
  log('question domains: ' + JSON.stringify(domCount));
  log('');
  /* what fraction of spreads would clear a candidate threshold — this is the
     number that decides whether a verdict rule ever fires */
  log('spreads clearing a threshold (pick verdict rules from these)');
  [0.5, 1.0, 1.5, 2.0, 2.5].forEach((t) => {
    log(`  strongest z >= ${t.toFixed(1)}: ${pct(all.strong.filter((z) => z >= t).length / all.strong.length)}` +
        `     tensest z <= ${(-t).toFixed(1)}: ${pct(all.tense.filter((z) => z <= -t).length / all.tense.length)}`);
  });
  [0.5, 0.34, 0.67].forEach((t) => {
    log(`  revShare >= ${t}: ${pct(all.revShare.filter((r) => r >= t).length / all.revShare.length)}`);
  });
  /* --- WP2 acceptance: fire rate, and no one template carrying the deck --- */
  log('');
  log('VERDICT ACCEPTANCE');
  const fired = verdicts.filter(Boolean);
  log(`  fire rate: ${pct(fired.length / verdicts.length)}  (target > 80%)`);

  /* Identify which template produced each line by matching against the page's
     own RESONANT bank with the slots wildcarded — the lines are unique once
     card names are substituted, so counting raw strings would always pass. */
  const bank = JSON.parse(ev('JSON.stringify(RESONANT)'));
  const tags = [];
  Object.keys(bank).forEach((rule) => bank[rule].forEach((tpl, i) => {
    const rx = new RegExp('^' + tpl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      .replace(/\\\{\w+\\\}/g, '.+') + '$', 'i');
    tags.push({ id: rule + '#' + i, rx, tpl });
  }));
  const counts = {}, unmatched = [];
  fired.forEach((v) => {
    const hit = tags.find((t) => t.rx.test(v));
    if (hit) counts[hit.id] = (counts[hit.id] || 0) + 1; else unmatched.push(v);
  });
  const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const worst = ranked.length ? ranked[0][1] / fired.length : 0;
  log(`  templates used: ${ranked.length} of ${tags.length}`);
  log(`  most common: ${pct(worst)}  (target < 15%)`);
  log(`  fell through to the tag counter: ${unmatched.length}`);
  log('');
  ranked.forEach(([id, c]) => log(`  ${id.padEnd(12)} ${String(c).padStart(3)}  ${pct(c / fired.length).padStart(6)}`));
  log('');
  log('a few, verbatim:');
  fired.slice(0, 6).forEach((v) => log('  ' + v));

  status.textContent = 'done';
}
</script>
